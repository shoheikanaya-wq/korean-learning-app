name: Add weak phrase tracking
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-weak-review-tracking.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add weak-phrase learning history
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="doneSet=new Set(JSON.parse(localStorage.getItem('korDone')||'[]')),voices=[];"
          new="doneSet=new Set(JSON.parse(localStorage.getItem('korDone')||'[]')),weakSet=new Set(JSON.parse(localStorage.getItem('korWeak')||'[]')),voices=[];"
          if old in s:
              s=s.replace(old,new,1)
          marker="function showFeedback(nodes){let f=$('feedback');f.replaceChildren(...nodes);f.classList.add('show')}"
          add=marker+"function updateWeak(sc){let k=c+':'+i;if(sc<75)weakSet.add(k);else if(sc>=90)weakSet.delete(k);localStorage.setItem('korWeak',JSON.stringify([...weakSet]))}"
          if 'function updateWeak(sc)' not in s:
              s=s.replace(marker,add,1)
          old_done="$('done').textContent=`できた：${[...doneSet].filter(k=>k.startsWith(c+':')).length} / ${D[c].length}`;"
          new_done="$('done').textContent=`できた：${[...doneSet].filter(k=>k.startsWith(c+':')).length} / ${D[c].length}　要復習：${[...weakSet].filter(k=>k.startsWith(c+':')).length}`;"
          if old_done in s:
              s=s.replace(old_done,new_done,1)
          speech="let heard=e.results[0][0].transcript,target=D[c][i][1],sc=similarity(heard,target),msg="
          if speech in s and 'updateWeak(sc);showFeedback' not in s:
              s=s.replace("showFeedback([textNode('div','聞き取り一致度 '+sc+'%','score')", "updateWeak(sc);showFeedback([textNode('div','聞き取り一致度 '+sc+'%','score')",1)
          write="let mine=$('writebox').value,target=D[c][i][1],sc=similarity(mine,target),box=$('writeanswer');box.replaceChildren();"
          if write in s and "updateWeak(sc);let msg=" not in s:
              s=s.replace(write,write+"updateWeak(sc);",1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify tracking
        run: |
          grep -q "korWeak" index.html
          grep -q "function updateWeak" index.html
          grep -q "要復習" index.html
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Track phrases that need review'
          git push
