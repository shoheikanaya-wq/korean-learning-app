name: Pronunciation and intonation pass v2.4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pronunciation-intonation-pass-v24.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine pronunciation and intonation
        run: |
          python - <<'PY'
          from pathlib import Path

          # Refine selected extra lessons toward actual heard Korean, not letter-by-letter kana.
          p=Path('lessons-extra.js')
          s=p.read_text(encoding='utf-8')
          repl={
            "'몇 시에 탑승해요?','ミョッ シエ タプスンヘヨ','→ → ↗'":"'몇 시에 탑승해요?','ミョッ シエ タプッスンヘヨ','↗ → 〜 ↗'",
            "'탑승구가 어디예요?','タプッスングガ オディエヨ','→ → ↗'":"'탑승구가 어디예요?','タプッスングガ オディエヨ','↴ → 〜 ↗'",
            "'비행기가 지연됐어요?','ピヘンギガ チヨンドェッソヨ','→ ↗ ↗'":"'비행기가 지연됐어요?','ピヘンギガ チヨンドェッソヨ','↴ → 〜 ↗'",
            "'옆방이 너무 시끄러워요.','ヨッパンイ ノム シックロウォヨ','→ → ↘'":"'옆방이 너무 시끄러워요.','ヨッパンイ ノム シックロウォヨ','↴ → 〜 ↘'",
            "'몇 번 출구로 나가요?','ミョッポン チュルグロ ナガヨ','→ → ↗'":"'몇 번 출구로 나가요?','ミョッポン チュルグロ ナガヨ','↗ → 〜 ↗'",
            "'사진 좀 찍어 주세요.','サジン チョム チゴ ジュセヨ','→ → ↘'":"'사진 좀 찍어 주세요.','サジン チョム チゴ ジュセヨ','↴ → 〜 ↘'",
            "'몇 시까지 해요?','ミョッ シッカジ ヘヨ','→ ↗'":"'몇 시까지 해요?','ミョッ シッカジ ヘヨ','↗ 〜 ↗'",
            "'자료를 보내 주세요.','チャリョルル ポネ ジュセヨ','→ ↘'":"'자료를 보내 주세요.','チャリョルル ポネ ジュセヨ','↴ → 〜 ↘'",
            "'메일 확인 부탁드립니다.','メイル ファギン プタクトゥリムニダ','→ ↘'":"'메일 확인 부탁드립니다.','メイル ファギン プタットゥリムニダ','↴ → 〜 ↘'",
            "'회의를 시작하겠습니다.','フェイルル シジャカゲッスムニダ','→ → ↘'":"'회의를 시작하겠습니다.','フェイルル シジャカゲッスムニダ','↴ → 〜 ↘'",
            "'작업이 조금 늦어지고 있어요.','チャゴビ チョグム ヌジョジゴ イッソヨ','→ → → ↘'":"'작업이 조금 늦어지고 있어요.','チャゴビ チョグム ヌジョジゴ イッソヨ','↴ → 〜 〜 ↘'",
            "'기계를 멈춰 주세요.','キゲルル モムチョ ジュセヨ','→ ↘'":"'기계를 멈춰 주세요.','キゲルル モムチョ ジュセヨ','↴ → 〜 ↘'",
            "'점검이 필요합니다.','チョムゴミ ピリョハムニダ','→ ↘'":"'점검이 필요합니다.','チョムゴミ ピリョハムニダ','↴ → 〜 ↘'",
            "'압력이 낮아요.','アムリョギ ナジャヨ','→ ↘'":"'압력이 낮아요.','アムニョギ ナジャヨ','↴ → ↘'"
          }
          for old,new in repl.items():
              if old in s:
                  s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          # Upgrade the renderer to visually support richer intonation symbols.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('Ver.2.3','Ver.2.4')
          s=s.replace("arrows[n]==='↗'?'high':arrows[n]==='↘'?'low':''", "['↗','↴'].includes(arrows[n])?'high':['↘','↵'].includes(arrows[n])?'low':''")
          s=s.replace("$('tone').textContent=tone||''", "$('tone').textContent=tone||'';$('tone').setAttribute('aria-label','抑揚 '+(tone||''))")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'Ver.2.4' index.html
          grep -q 'アムニョギ ナジャヨ' lessons-extra.js
          grep -q 'プタットゥリムニダ' lessons-extra.js
          grep -q '〜' lessons-extra.js
          grep -q "aria-label','抑揚" index.html
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html lessons-extra.js
          git commit -m 'Improve Korean pronunciation and intonation guidance'
          git push
