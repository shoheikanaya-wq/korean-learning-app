name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable debug APK
        working-directory: android
        run: gradle assembleDebug
      - name: Prepare friendly APK filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk korean-learning-app.apk
      - uses: actions/upload-artifact@v4
        with:
          name: korean-learning-app-apk
          path: korean-learning-app.apk
          if-no-files-found: error
      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --title "韓国語アプリ Android版" --notes "スマホのホーム画面から起動できるAndroid APKです。"
          gh release upload android-latest korean-learning-app.apk --clobber
