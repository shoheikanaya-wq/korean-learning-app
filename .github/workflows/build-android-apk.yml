name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'icons/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Korean launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp icons/icon-512.png android/app/src/main/res/drawable/korean_icon.png
      - name: Build installable debug APK
        working-directory: android
        run: gradle assembleDebug
      - name: Validate APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
      - name: Prepare friendly APK filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk korean-learning-app.apk
      - uses: actions/upload-artifact@v4
        with:
          name: korean-learning-app-apk
          path: korean-learning-app.apk
          if-no-files-found: error
      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --title "韓国語アプリ Android版" --notes "スマホにインストールして専用アイコンから起動できるAndroid APKです。"
          gh release upload android-latest korean-learning-app.apk --clobber
