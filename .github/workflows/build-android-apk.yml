name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Korean launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp icons/icon-512.png android/app/src/main/res/drawable/korean_icon.png
      - name: Build installable debug APK
        working-directory: android
        run: gradle assembleDebug
      - name: Validate APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          echo "Android shell version:"
          grep -E "version(Code|Name)" android/app/build.gradle
      - name: Prepare friendly APK filename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk korean-learning-app.apk
      - uses: actions/upload-artifact@v4
        with:
          name: korean-learning-app-apk
          path: korean-learning-app.apk
          if-no-files-found: error
