name: Build signed Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Require private signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KS"
          test -n "$SP"
          test -n "$KA"
          test -n "$KP"

      - name: Restore signing keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS" | base64 --decode > "$RUNNER_TEMP/korean-release.jks"
          test -s "$RUNNER_TEMP/korean-release.jks"

      - name: Install launcher icon
        run: cp icons/icon-512.png android/app/src/main/res/drawable/korean_icon.png

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/korean-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Validate signed APK
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK"
          keytool -printcert -jarfile "$APK" | sed -n '1,12p'
          sha256sum "$APK"
          cp "$APK" korean-app-mugunghwa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: korean-app-mugunghwa-signed
          path: korean-app-mugunghwa.apk
          if-no-files-found: error

      - name: Publish stable signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-stable >/dev/null 2>&1 || gh release create android-stable --title "韓国語アプリ Android安定版"
          gh release upload android-stable korean-app-mugunghwa.apk --clobber
          gh release edit android-stable --notes "固定署名 Android APK Ver.3.14.45。今後の更新も同じ署名鍵を使用します。"
