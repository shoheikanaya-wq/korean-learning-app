name: Connect lesson library
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-lesson-library.yml'
      - 'lessons.js'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace inline lessons with external library
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '<script src="./lessons.js"></script>' not in s:
              s=s.replace('<script>const D=', '<script src="./lessons.js"></script><script>const D=', 1)
          s2,n=re.subn(r'const D=\{.*?\};const \$=', 'const D=window.LESSONS;const $=', s, count=1, flags=re.S)
          if n!=1:
              raise SystemExit('Could not locate inline lesson dataset')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Verify lesson wiring and count
        run: |
          grep -q '<script src="./lessons.js"></script>' index.html
          grep -q 'const D=window.LESSONS' index.html
          python - <<'PY'
          from pathlib import Path
          s=Path('lessons.js').read_text(encoding='utf-8')
          count=s.count("['")
          if count < 100:
              raise SystemExit(f'Expected at least 100 lesson rows, found {count}')
          print('lesson rows:', count)
          PY
      - name: Commit app wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use expanded 100-phrase lesson library'
          git push
