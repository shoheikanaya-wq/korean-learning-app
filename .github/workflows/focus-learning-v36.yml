name: Focus Korean learning v3.6
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/focus-learning-v36.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove install and sharing UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          install='<div class="installbar"><a class="installlink" href="./install.html">📲 このスマホにインストール</a><button id="shareApp">人にアプリを渡す</button></div><p id="shareStatus" role="status"></p>'
          if install not in s: raise SystemExit('install/share UI marker missing')
          s=s.replace(install,'')
          s=s.replace('<span class="version">Ver.3.5</span>','<span class="version">Ver.3.6</span>')
          s=s.replace('<div>Ver.3.5</div><div>Personal Korean Learning Project</div>','<div>Ver.3.6</div><div>Personal Korean Learning Project</div>')
          s=s.replace('<div>Ver.3.5　インストール・共有案内／A・Bの声設定／指でなぞる手書き練習</div>','<div>Ver.3.6　学習画面に集中する構成へ整理</div><div>Ver.3.5　A・Bの声設定／指でなぞる手書き練習</div>')
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js')
          t=sw.read_text(encoding='utf-8')
          t=t.replace("const CACHE='kor-practice-v16';","const CACHE='kor-practice-v17';")
          t=t.replace(",'./install.html','./install-check.js?v=3501','./install.js?v=3501','./install-qr.svg'",'')
          sw.write_text(t,encoding='utf-8')
          PY
      - name: Verify learning-only home
        run: |
          grep -q 'Ver.3.6' index.html
          grep -q '🏠 日常会話' index.html
          grep -q '✈️ 旅行韓国語' index.html
          grep -q '💼 ビジネス韓国語' index.html
          ! grep -q 'このスマホにインストール' index.html
          ! grep -q '人にアプリを渡す' index.html
          ! grep -q "'./install.html'" sw.js
          grep -q "kor-practice-v17" sw.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Simplify home to Korean learning only'
          git push
