name: Learning flow browser tests
on:
  push:
    branches: [main, learning-v315]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix /tmp/flow-test --no-save playwright
      - run: /tmp/flow-test/node_modules/.bin/playwright install --with-deps chromium
      - name: Check behavior
        env:
          NODE_PATH: /tmp/flow-test/node_modules
        run: |
          python3 -m http.server 8765 >/tmp/flow-server.log 2>&1 &
          node tests/learning-flow.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-flow-screenshots
          path: /tmp/*-315.png
