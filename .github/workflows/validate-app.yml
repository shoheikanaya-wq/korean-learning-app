name: Validate Korean learning app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files
        run: |
          test -f index.html
          test -f lessons.js
          test -f lessons-extra.js
          test -f manifest.webmanifest
          test -f sw.js
      - name: Validate current PWA wiring
        run: |
          grep -q 'rel="manifest"' index.html
          grep -Eq "serviceWorker\.register\('./sw\.js\?v=[0-9]+'" index.html
          grep -Fq 'window.LESSONS?.[cat]' index.html
          grep -Eq '<script src="\./lessons\.js\?v=[0-9]+"></script>' index.html
          grep -Eq '<script src="\./lessons-extra\.js\?v=[0-9]+"></script>' index.html
          grep -q '"display":"standalone"' manifest.webmanifest
          grep -q '"scope":"./"' manifest.webmanifest
      - name: Validate current learning flow
        run: |
          grep -q 'data-start="daily"' index.html
          grep -q 'data-start="travel"' index.html
          grep -q 'data-start="business"' index.html
          grep -q 'id="listen"' index.html
          grep -q 'id="speak"' index.html
          grep -q 'id="showWrite"' index.html
          grep -q 'id="conv"' index.html
          grep -q 'id="convReply"' index.html
          grep -q 'id="finish"' index.html
      - name: Validate lesson library structure
        run: |
          node - <<'NODE'
          global.window={};
          require('./lessons.js');
          require('./lessons-extra.js');
          const D=window.LESSONS;
          const cats=['daily','travel','business'];
          if(!D) throw new Error('window.LESSONS is missing');
          let total=0;
          for(const cat of cats){
            if(!Array.isArray(D[cat])||D[cat].length<15) throw new Error(`Invalid category: ${cat}`);
            for(const row of D[cat]) if(!Array.isArray(row)||row.length!==7||row.some(v=>typeof v!=='string'||!v.trim())) throw new Error(`Invalid row in ${cat}`);
            total+=D[cat].length;
          }
          if(total<45) throw new Error(`Too few total lessons: ${total}`);
          console.log(`Validated ${total} lessons`);
          NODE
      - name: Validate current pronunciation and handwriting UI
        run: |
          grep -q 'id="prosody"' index.html
          grep -q 'class="pron"' index.html
          grep -q "className='mora'" index.html
          grep -q 'id="draw"' index.html
          grep -q 'touch-action:none' index.html
      - name: Validate hardened service worker
        run: |
          grep -Eq "const CACHE='kor-practice-v[0-9]+'" sw.js
          grep -q 'lessons.js' sw.js
          grep -q 'lessons-extra.js' sw.js
          grep -q "url.origin!==self.location.origin" sw.js
          grep -q "request.mode==='navigate'" sw.js
          grep -q "cache:'no-store'" sw.js
