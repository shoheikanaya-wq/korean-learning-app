name: Validate Korean learning app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate required files
        run: |
          test -f index.html
          test -f lessons.js
          test -f lessons-extra.js
          test -f curriculum-v4.js
          test -f manifest.webmanifest
          test -f sw.js
      - name: Validate current app wiring
        run: |
          grep -Eq "serviceWorker\.register\('./sw\.js\?v=[0-9]+'" index.html
          grep -Fq 'window.LESSONS?.[cat]' index.html
          grep -Eq '<script src="\./lessons\.js\?v=[0-9]+"></script>' index.html
          grep -Eq '<script src="\./lessons-extra\.js\?v=[0-9]+"></script>' index.html
          grep -Eq '<script src="\./curriculum-v4\.js\?v=[0-9]+"></script>' index.html
          ! grep -Fq '英語を練習する' index.html
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8'));
          if(m.display!=='standalone') throw new Error('manifest display must be standalone');
          if(!m.start_url||!m.scope) throw new Error('manifest start_url/scope missing');
          if(!Array.isArray(m.icons)||!m.icons.some(x=>x.sizes==='192x192')||!m.icons.some(x=>x.sizes==='512x512')) throw new Error('required PWA icons missing');
          if(!Array.isArray(m.screenshots)||m.screenshots.length<2) throw new Error('PWA screenshots missing');
          for(const s of m.screenshots){
            if(!/image\/(png|jpeg)/.test(s.type||'')) throw new Error('screenshot must be PNG or JPEG');
            const p='.'+s.src.replace('/korean-learning-app','');
            if(!fs.existsSync(p)) throw new Error('missing screenshot file: '+p);
          }
          NODE
      - name: Validate lesson library
        run: |
          node - <<'NODE'
          global.window={};
          require('./lessons.js');
          require('./lessons-extra.js');
          require('./curriculum-v4.js');
          const D=window.LESSONS;
          const cats=['beginner','intermediate','daily','travel','business','advanced','super'];
          if(!D) throw new Error('window.LESSONS is missing');
          let total=0;
          const mins={beginner:10,intermediate:20,daily:15,travel:15,business:10,advanced:15,super:15};
          for(const cat of cats){
            if(!Array.isArray(D[cat])||D[cat].length<mins[cat]) throw new Error(`Invalid category: ${cat} (${D[cat]?.length||0})`);
            for(const [n,row] of D[cat].entries()){
              if(!Array.isArray(row)||row.length!==7||row.some(v=>typeof v!=='string'||!v.trim())) throw new Error(`Invalid row in ${cat} #${n+1}`);
              if(!/[가-힣]/.test(row[1])) throw new Error(`No Hangul in ${cat} #${n+1}`);
              if(!/[ぁ-んァ-ヶ一-龠]/.test(row[4])) throw new Error(`No Japanese meaning in ${cat} #${n+1}`);
            }
            total+=D[cat].length;
          }
          if(total<100) throw new Error(`Too few total lessons: ${total}`);
          if(window.KOR_CATEGORY_KEYS?.join(',')!==cats.join(',')) throw new Error('Category order mismatch');
          console.log(`Validated ${total} Korean lessons across ${cats.length} categories`);
          NODE
      - name: Validate PWA asset dimensions
        run: |
          file icons/icon-192.png | tee /tmp/icon192.txt
          file icons/icon-512.png | tee /tmp/icon512.txt
          file screenshots/home.jpg | tee /tmp/home-shot.txt
          file screenshots/lesson.jpg | tee /tmp/lesson-shot.txt
          grep -Eq '192 x 192|192x192' /tmp/icon192.txt
          grep -Eq '512 x 512|512x512' /tmp/icon512.txt
          grep -Eq '320 x 500|320x500' /tmp/home-shot.txt
          grep -Eq '320 x 500|320x500' /tmp/lesson-shot.txt
      - name: Validate service worker
        run: |
          grep -Eq "const CACHE='kor-practice-v[0-9]+'" sw.js
          grep -q 'lessons.js' sw.js
          grep -q 'lessons-extra.js' sw.js
          grep -q 'curriculum-v4.js' sw.js
          grep -q "url.origin!==self.location.origin" sw.js
          grep -q "request.mode==='navigate'" sw.js
          grep -q "cache:'no-store'" sw.js
