name: Add weak review navigation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-weak-review-navigation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add review navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          s=s.replace('.scene{width:100%;padding:8px;margin-top:9px}', '.scene{width:100%;padding:8px;margin-top:9px}.reviewjump{width:100%;min-height:48px;margin-top:8px;border-style:dashed;background:#fff7cf}')
          s=s.replace('<select id="scene" class="scene"></select><main', '<select id="scene" class="scene"></select><button id="weakNext" class="reviewjump">要復習を練習</button><main')
          marker="$('scene').onchange=e=>{i=+e.target.value;render()};"
          addition="$('weakNext').onclick=()=>{let weak=[...weakSet].filter(k=>k.startsWith(c+':')).map(k=>+k.split(':')[1]).filter(n=>Number.isInteger(n)&&n>=0&&n<D[c].length).sort((a,b)=>a-b);if(!weak.length){showFeedback([textNode('div','このカテゴリに要復習はありません。')]);return}let next=weak.find(n=>n>i);i=next===undefined?weak[0]:next;$('scene').value=i;render()};"
          if addition not in s:
              if marker not in s: raise SystemExit('scene change marker missing')
              s=s.replace(marker, marker+addition, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify patch
        run: |
          grep -q 'id="weakNext"' index.html
          grep -q '要復習を練習' index.html
          grep -q "weakSet.*startsWith(c+':')" index.html
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add one-tap weak phrase review navigation'
          git push
