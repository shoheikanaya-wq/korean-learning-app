name: Deploy KOR Progress API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "server/**"
      - "package.json"
      - "Dockerfile"
      - ".github/workflows/deploy-progress-api.yml"

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        id: gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Preflight Google Cloud
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ secrets.GCP_PROJECT_ID }}"
          test -n "$PROJECT" || { echo "GCP_PROJECT_ID is missing"; exit 1; }
          gcloud secrets describe KOR_ADMIN_TOKEN --project "$PROJECT" >/dev/null             || { echo "Secret Manager secret KOR_ADMIN_TOKEN is missing"; exit 1; }
          gcloud firestore databases describe --database='(default)' --project "$PROJECT" >/dev/null             || { echo "Firestore default database is missing"; exit 1; }
          echo "GCP preflight OK"

      - name: Deploy Korean progress API
        id: deployapi
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy kor-progress-api \
            --source . \
            --region asia-northeast1 \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --allow-unauthenticated \
            --set-env-vars ALLOWED_ORIGIN=https://shoheikanaya-wq.github.io,KOR_ENABLE_STORAGE=1 \
            --set-secrets KOR_ADMIN_TOKEN=KOR_ADMIN_TOKEN:latest

      - name: Read and test service URL
        id: service
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe kor-progress-api \
            --region asia-northeast1 \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --format='value(status.url)')"
          test -n "$URL" || { echo "Cloud Run URL was empty"; exit 1; }
          curl --fail --silent --show-error "$URL/health"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Cloud Run health OK: $URL"

      - name: Connect learner app to deployed API
        id: connect
        shell: bash
        env:
          SERVICE_URL: ${{ steps.service.outputs.url }}
        run: |
          set -euo pipefail
          printf "window.KOR_PROGRESS_API = '%s';\n" "$SERVICE_URL" > progress-config.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add progress-config.js
          if git diff --cached --quiet; then
            echo "progress-config.js already points to this API"
          else
            git commit -m "Connect Korean app to deployed progress API"
            git push
          fi


      - name: Record deployment status
        if: always()
        shell: bash
        env:
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          GCLOUD_OUTCOME: ${{ steps.gcloud.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployapi.outcome }}
          SERVICE_OUTCOME: ${{ steps.service.outcome }}
          CONNECT_OUTCOME: ${{ steps.connect.outcome }}
          SERVICE_URL: ${{ steps.service.outputs.url }}
        run: |
          set -euo pipefail
          cat > deploy-status.json <<EOF
          {
            "commit": "$GITHUB_SHA",
            "auth": "$AUTH_OUTCOME",
            "gcloud": "$GCLOUD_OUTCOME",
            "preflight": "$PREFLIGHT_OUTCOME",
            "deploy": "$DEPLOY_OUTCOME",
            "service": "$SERVICE_OUTCOME",
            "connect": "$CONNECT_OUTCOME",
            "service_url": "$SERVICE_URL"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-status.json
          if git diff --cached --quiet; then
            echo "Deployment status unchanged"
          else
            git commit -m "Record KOR progress API deployment status"
            git push
          fi
