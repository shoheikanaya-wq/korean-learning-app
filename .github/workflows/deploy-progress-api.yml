name: Deploy KOR Progress API

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build
        run: gcloud builds submit --tag "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/kor/kor-progress:${{ github.sha }}"
      - name: Deploy
        run: >
          gcloud run deploy kor-progress
          --image "${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/kor/kor-progress:${{ github.sha }}"
          --region "${{ secrets.GCP_REGION }}"
          --platform managed
          --allow-unauthenticated
          --set-env-vars "ALLOWED_ORIGIN=https://shoheikanaya-wq.github.io,KOR_ENABLE_STORAGE=1"
          --set-secrets "KOR_ADMIN_TOKEN=KOR_ADMIN_TOKEN:latest"
