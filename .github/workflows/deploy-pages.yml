name: Deploy Korean app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build Android APK for direct Pages download
        run: |
          set -euo pipefail
          cp icons/icon-512.png android/app/src/main/res/drawable/korean_icon.png
          cd android
          gradle --no-daemon assembleDebug
          cd ..
          mkdir -p downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk downloads/korean-app-mugunghwa.apk
          test -s downloads/korean-app-mugunghwa.apk
          sha256sum downloads/korean-app-mugunghwa.apk
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published PWA endpoints
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}"
          echo "BASE=$BASE"
          sleep 8

          check() {
            local url="$1"
            local expect="$2"
            echo
            echo "=== $url ==="
            curl -fsSL --retry 4 --retry-delay 2 -D /tmp/headers "$url" -o /tmp/body
            cat /tmp/headers
            grep -Ei '^content-type:' /tmp/headers || true
            grep -Eq "$expect" /tmp/headers
            wc -c /tmp/body
          }

          check "$BASE/" 'content-type:.*text/html'
          check "$BASE/manifest.webmanifest" 'content-type:.*(application/manifest\+json|application/json|application/octet-stream|text/plain)'
          node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('/tmp/body','utf8'));
          console.log(m);
          NODE

          check "$BASE/icons/icon-192.png" 'content-type:.*image/png'
          file /tmp/body
          check "$BASE/icons/icon-512.png" 'content-type:.*image/png'
          file /tmp/body
          check "$BASE/?source=pwa" 'content-type:.*text/html'
          check "$BASE/downloads/korean-app-mugunghwa.apk" 'content-type:.*(application/vnd.android.package-archive|application/octet-stream|application/zip)'
          test "$(wc -c < /tmp/body)" -gt 20000
