name: Repair PWA installability

on:
  push:
    paths:
      - '.github/workflows/pwa-installability-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair installability and bump Ver.3.2
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="$('mode').onclick=()=>{let on=document.body.classList.toggle('big');$('mode').textContent=on?'文字 標準':'文字 大きめ';localStorage.setItem('korBig',on?'1':'0')};"
          new="const modeBtn=$('mode');if(modeBtn){modeBtn.onclick=()=>{let on=document.body.classList.toggle('big');modeBtn.textContent=on?'文字 標準':'文字 大きめ';localStorage.setItem('korBig',on?'1':'0')}};"
          s=s.replace(old,new)
          s=s.replace('<meta name="theme-color" content="#222222"><link rel="manifest" href="./manifest.webmanifest">','<meta name="theme-color" content="#65584d"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="韓国語">')
          s=s.replace('Ver.3.1</span>','Ver.3.2</span>',1)
          s=s.replace('lessons.js?v=3101','lessons.js?v=3201').replace('lessons-extra.js?v=3101','lessons-extra.js?v=3201').replace("register('./sw.js?v=3101'","register('./sw.js?v=3201'")
          p.write_text(s,encoding='utf-8')

          manifest={
            'id':'./','name':'韓国語 実践トレーニング','short_name':'韓国語',
            'description':'日常・トラベル・ビジネスを聞く・話す・使うで練習する韓国語学習アプリ',
            'start_url':'./?source=pwa&v=3.2','scope':'./','display':'standalone',
            'orientation':'portrait-primary','background_color':'#f3efe6','theme_color':'#65584d','lang':'ja','dir':'ltr',
            'icons':[
              {'src':'./icons/icon-192.png','sizes':'192x192','type':'image/png','purpose':'any'},
              {'src':'./icons/icon-512.png','sizes':'512x512','type':'image/png','purpose':'any maskable'}
            ]
          }
          Path('manifest.webmanifest').write_text(json.dumps(manifest,ensure_ascii=False,separators=(',',':')),encoding='utf-8')

          sw=Path('sw.js').read_text(encoding='utf-8')
          sw=re.sub(r"const CACHE='kor-practice-v\d+';","const CACHE='kor-practice-v14';",sw)
          sw=sw.replace("'./lessons.js?v=3101','./lessons-extra.js?v=3101'","'./lessons.js?v=3201','./lessons-extra.js?v=3201'")
          Path('sw.js').write_text(sw,encoding='utf-8')
          PY
      - name: Verify repair
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          s=Path('index.html').read_text(encoding='utf-8')
          m=json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert "const modeBtn=$('mode');if(modeBtn)" in s
          assert "register('./sw.js?v=3201'" in s
          assert 'apple-touch-icon' in s
          assert 'Ver.3.2' in s
          assert m['display']=='standalone' and m['start_url'].endswith('v=3.2')
          assert any(i['sizes']=='192x192' for i in m['icons'])
          assert any(i['sizes']=='512x512' for i in m['icons'])
          assert "kor-practice-v14" in sw
          print('PWA installability repair checks passed')
          PY
      - name: Commit repaired app
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html manifest.webmanifest sw.js
          git commit -m 'Repair PWA installability for Ver.3.2'
          git push
