<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#222222"><link rel="manifest" href="./manifest.webmanifest"><title>PWA確認</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:720px;margin:auto;padding:16px;background:#fffaf2;color:#171717}h1{font-size:25px}.card{background:#fff;border:2px solid #222;border-radius:16px;padding:14px;margin:12px 0}.ok{font-weight:900}.row{padding:7px 0;border-bottom:1px solid #ddd}.row:last-child{border:0}button{width:100%;min-height:56px;border:2px solid #222;border-radius:14px;background:#222;color:#fff;font-size:17px;font-weight:900}</style></head><body><h1>韓国語アプリ PWA確認</h1><div class="card"><div class="row">起動表示：<span id="mode">確認中</span></div><div class="row">Service Worker：<span id="sw">確認中</span></div><div class="row">Manifest：<span id="mf">確認中</span></div><div class="row">インストール候補：<span id="install">確認中</span></div></div><div class="card"><b>判定</b><p id="result">確認しています…</p></div><button onclick="location.href='./'">韓国語アプリへ戻る</button><script>const $=id=>document.getElementById(id);const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;$('mode').textContent=standalone?'独立アプリ表示':'ブラウザ表示';$('mode').className=standalone?'ok':'';let promptSeen=false;addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptSeen=true;$('install').textContent='インストール可能';judge()});async function check(){try{if('serviceWorker'in navigator){await navigator.serviceWorker.register('./sw.js');const reg=await navigator.serviceWorker.ready;$('sw').textContent=reg.active?'動作中':'登録済み'}else{$('sw').textContent='未対応'}}catch(e){$('sw').textContent='エラー'}try{const r=await fetch('./manifest.webmanifest',{cache:'no-store'});const m=await r.json();$('mf').textContent=m.display==='standalone'&&m.scope==='./'?'正常':'要確認'}catch(e){$('mf').textContent='エラー'}setTimeout(()=>{if(!promptSeen)$('install').textContent=standalone?'インストール済みの可能性':'ブラウザ側判定待ち';judge()},1200)}function judge(){if(standalone){$('result').textContent='URLバーなしの独立アプリ表示です。PWA起動は正常です。'}else if($('sw').textContent==='動作中'&&$('mf').textContent==='正常'){$('result').textContent='PWA側の基本条件は整っています。Chromeメニューに「アプリをインストール」が出るか確認できます。'}else{$('result').textContent='まだ確認が必要な項目があります。表示された結果をそのまま教えてください。'}}check();</script></body></html>
