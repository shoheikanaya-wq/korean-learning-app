<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#65584d"><link rel="manifest" href="./manifest.webmanifest"><title>韓国語アプリをインストール</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:720px;margin:auto;padding:16px;background:#f3efe6;color:#302a24}h1{font-size:25px}.card{background:#fbf7ef;border:2px solid #8f8375;border-radius:16px;padding:14px;margin:12px 0}.ok{font-weight:900}.row{padding:7px 0;border-bottom:1px solid #d8cec1}.row:last-child{border:0}button{width:100%;min-height:58px;border:2px solid #65584d;border-radius:14px;background:#65584d;color:#fffaf3;font-size:18px;font-weight:900;margin-top:10px}button.secondary{background:#fbf7ef;color:#302a24}button[hidden]{display:none}</style></head><body><h1>韓国語アプリをホーム画面に追加</h1><div class="card"><div class="row">Service Worker：<span id="sw">確認中</span></div><div class="row">Manifest：<span id="mf">確認中</span></div><div class="row">192pxアイコン：<span id="i192">確認中</span></div><div class="row">512pxアイコン：<span id="i512">確認中</span></div><div class="row">インストール状態：<span id="install">確認中</span></div></div><div class="card"><b>スマホでの追加</b><p id="result">確認しています…</p><button id="installBtn" hidden>📱 このアプリをインストール</button><button class="secondary" onclick="location.href='./?source=pwa&v=3.1'">韓国語アプリへ戻る</button></div><script>const $=id=>document.getElementById(id);const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;let deferredPrompt=null;let iconsOk=false;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('install').textContent='インストールできます';$('installBtn').hidden=false;$('result').textContent='下の「このアプリをインストール」をタップしてください。'});addEventListener('appinstalled',()=>{$('install').textContent='インストール済み';$('installBtn').hidden=true;$('result').textContent='ホーム画面に追加されました。以後は「韓国語」アイコンから起動できます。'});$('installBtn').onclick=async()=>{if(!deferredPrompt){$('result').textContent='Chromeの判定待ちです。数秒待ってもう一度お試しください。';return}deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('installBtn').hidden=true};async function check(){try{if('serviceWorker'in navigator){await navigator.serviceWorker.register('./sw.js?v=3102',{updateViaCache:'none'});const reg=await navigator.serviceWorker.ready;$('sw').textContent=reg.active?'動作中':'登録済み'}else{$('sw').textContent='未対応'}}catch(e){$('sw').textContent='エラー'}try{const r=await fetch('./manifest.webmanifest',{cache:'no-store'});const m=await r.json();$('mf').textContent=m.display==='standalone'&&m.scope==='./'?'正常':'要確認';const icons=Array.isArray(m.icons)?m.icons:[];const has192=icons.some(x=>String(x.sizes||'').split(/\s+/).includes('192x192'));const has512=icons.some(x=>String(x.sizes||'').split(/\s+/).includes('512x512'));$('i192').textContent=has192?'設定済み':'未設定';$('i512').textContent=has512?'設定済み':'未設定';iconsOk=has192&&has512}catch(e){$('mf').textContent='エラー';$('i192').textContent='確認不可';$('i512').textContent='確認不可'}setTimeout(()=>{if(standalone){$('install').textContent='インストール済み';$('result').textContent='すでに独立アプリとして起動しています。'}else if(!deferredPrompt&&iconsOk&&$('sw').textContent==='動作中'&&$('mf').textContent==='正常'){$('install').textContent='Chrome判定待ち';$('result').textContent='PWA側の基本条件は整っています。Chromeでこのページを開いたまま数秒待ってください。「このアプリをインストール」が出ればタップできます。出ない場合はChromeの「ホーム画面に追加」から追加してください。'}},1800)}check();</script></body></html>
