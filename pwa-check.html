<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#65584d"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><title>韓国語アプリをインストール</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:720px;margin:auto;padding:16px;background:#f3efe6;color:#302a24}h1{font-size:25px}.ver{display:inline-block;margin-left:7px;padding:3px 8px;border-radius:999px;background:#65584d;color:#fff;font-size:13px;vertical-align:middle}.card{background:#fbf7ef;border:2px solid #8f8375;border-radius:16px;padding:14px;margin:12px 0}.row{padding:7px 0;border-bottom:1px solid #d8cec1}.row:last-child{border:0}button{width:100%;min-height:58px;border:2px solid #65584d;border-radius:14px;background:#65584d;color:#fffaf3;font-size:18px;font-weight:900;margin-top:10px}button.secondary{background:#fbf7ef;color:#302a24}button[hidden]{display:none}.small{font-size:13px;color:#65584d;line-height:1.5}.good{font-weight:900}</style></head><body><h1>韓国語アプリをホーム画面に追加 <span class="ver">Ver.3.2</span></h1><div class="card"><div class="row">Service Worker：<span id="sw">確認中</span></div><div class="row">SW制御状態：<span id="ctrl">確認中</span></div><div class="row">Manifest：<span id="mf">確認中</span></div><div class="row">192pxアイコン：<span id="i192">確認中</span></div><div class="row">512pxアイコン：<span id="i512">確認中</span></div><div class="row">ページ滞在：<span id="dwell">0秒</span></div><div class="row">タップ確認：<span id="tapstate">未完了</span></div><div class="row">インストール状態：<span id="install">確認中</span></div></div><div class="card"><b>Chrome判定テスト</b><p id="result">まず下のボタンを1回タップして、そのまま30秒以上このページを開いてください。</p><button id="engageBtn">① PWA判定用に1回タップ</button><button id="installBtn" hidden>📱 このアプリをインストール</button><button class="secondary" onclick="location.href='./?source=pwa&v=3.2'">韓国語アプリへ戻る</button><p class="small">Chromeはインストール案内を出す際、PWA要件に加えて一定のユーザー操作・滞在を判定材料にします。</p></div><script>const $=id=>document.getElementById(id);const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;let deferredPrompt=null;let iconsOk=false;let tapped=sessionStorage.getItem('pwaTapped')==='1';let started=Date.now();$('tapstate').textContent=tapped?'完了':'未完了';$('engageBtn').textContent=tapped?'✓ タップ確認済み':'① PWA判定用に1回タップ';$('engageBtn').onclick=()=>{tapped=true;sessionStorage.setItem('pwaTapped','1');$('tapstate').textContent='完了';$('engageBtn').textContent='✓ タップ確認済み';$('result').textContent='そのまま30秒以上このページを開いてください。'};setInterval(()=>{const sec=Math.floor((Date.now()-started)/1000);$('dwell').textContent=sec+'秒';if(sec>=30&&tapped&&!deferredPrompt){$('result').textContent='30秒経過＋タップ完了です。右上の︙を開いて「アプリをインストール」が出るか確認してください。';$('dwell').className='good';$('tapstate').className='good'}},1000);addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('install').textContent='インストールできます';$('installBtn').hidden=false;$('result').textContent='判定が通りました。下の「このアプリをインストール」をタップしてください。'});addEventListener('appinstalled',()=>{$('install').textContent='インストール済み';$('installBtn').hidden=true;$('result').textContent='ホーム画面に「韓国語」アイコンが追加されました。'});$('installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null};async function check(){try{if('serviceWorker'in navigator){const reg=await navigator.serviceWorker.register('./sw.js?v=3204',{updateViaCache:'none'});await reg.update();const ready=await navigator.serviceWorker.ready;$('sw').textContent=ready.active?'動作中':'登録済み';$('ctrl').textContent=navigator.serviceWorker.controller?'制御中':'未制御'}else{$('sw').textContent='未対応';$('ctrl').textContent='未対応'}}catch(e){$('sw').textContent='エラー';$('ctrl').textContent='確認不可'}try{const r=await fetch('./manifest.webmanifest?v=3204',{cache:'no-store'});const m=await r.json();$('mf').textContent=m.display==='standalone'&&String(m.scope||'').includes('/korean-learning-app/')?'正常':'要確認';const icons=Array.isArray(m.icons)?m.icons:[];const has192=icons.some(x=>String(x.sizes||'').includes('192x192'));const has512=icons.some(x=>String(x.sizes||'').includes('512x512'));$('i192').textContent=has192?'設定済み':'未設定';$('i512').textContent=has512?'設定済み':'未設定';iconsOk=has192&&has512}catch(e){$('mf').textContent='エラー'}if(standalone){$('install').textContent='インストール済み';$('result').textContent='すでに独立アプリとして起動しています。'}else{$('install').textContent='Chrome判定待ち'}}check();</script></body></html>
