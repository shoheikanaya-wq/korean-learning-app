<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f1e8"><title>英語 会話練習</title><link rel="manifest" href="./manifest.webmanifest?v=315000"><link rel="stylesheet" href="./english.css?v=315000"></head><body>
<header><h1>英語</h1><span>入門版 Ver.3.15.0</span></header>
<details><summary>⚙ ユーザー設定・韓国語版</summary><label for="flow">練習の進み方</label><select id="flow"><option value="auto">自動：聞く → 話す → 書く → 会話</option><option value="manual">マニュアル：選んだ練習だけ</option></select><p id="flowHint"></p><a href="./index.html">韓国語に戻る →</a><p>音声認識はブラウザのサービスへ音声を送る場合があります。通信・マイク許可が必要です。</p></details>
<nav aria-label="教材カテゴリ" id="categories"><button data-cat="daily">日常</button><button data-cat="travel">旅行</button><button data-cat="business">仕事</button><button id="review">復習</button></nav>
<label for="lessonSelect">教材を選ぶ</label><select id="lessonSelect"></select><p id="progress"></p>
<nav aria-label="練習モード" id="modes"><button data-mode="0">聞く</button><button data-mode="1">話す</button><button data-mode="2">書く</button><button data-mode="3">会話</button></nav>
<main><p id="meaning"></p><h2 id="target" lang="en"></h2><p id="tip"></p>
<section id="listenPanel"><button id="listen" class="primary">🔊 お手本を聞く</button><button id="slow">ゆっくり聞く</button><button id="blind">文字を隠して聞く</button><button id="reveal">文字を見る</button></section>
<section id="speakPanel" hidden><button id="speak" class="primary">🎤 話して確認</button><button id="speakModel">お手本をもう一度</button><button id="recall">英文を隠す／見る</button></section>
<section id="writePanel" hidden><p>日本語の意味から英文を思い出して入力します。</p><label for="answer">あなたの英文</label><textarea id="answer" lang="en" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea><button id="check" class="primary">答え合わせ</button><button id="answerHint">お手本を見る／隠す</button></section>
<section id="conversationPanel" hidden><p>相手</p><div id="partner" class="bubble" lang="en"></div><p id="replyMeaning"></p><button id="partnerListen" class="primary">🔊 相手の言葉を聞く</button><button id="reply" class="primary">🎤 自分の返事を話す</button><button id="replyHint">返事のお手本を見る／隠す</button><p id="replyText" lang="en" hidden></p><button id="replyModel">返事のお手本を聞く</button><small>決まった場面で返事を練習します。自由な返答の意味の正しさは自動判定しません。</small></section>
<div id="feedback" role="status" aria-live="polite"></div><button id="nextMode" class="primary">次の練習へ →</button>
</main><div class="rating"><p>見ないで言えましたか？</p><button id="good">○ 言えた・復習を予約</button><button id="again">△ もう一度練習する</button></div><p id="saved" role="status"></p><nav><button id="prev">← 前の教材</button><button id="next">次の教材 →</button></nav><p>入門15教材・米国英語のお手本。点数は認識文字の一致度です。</p>
<script src="./learning-tools.js?v=315000"></script><script src="./english-lessons.js?v=315000"></script><script src="./english.js?v=315000"></script></body></html>
