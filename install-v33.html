<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#65584d"><link rel="manifest" href="./manifest-install-v33.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><title>韓国語アプリ インストール</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f3efe6;color:#302a24;margin:0;padding:18px;max-width:680px}main{background:#fffaf3;border:2px solid #8f8375;border-radius:18px;padding:18px}h1{font-size:26px;margin-top:0}button{width:100%;min-height:62px;margin-top:12px;border:0;border-radius:14px;background:#65584d;color:white;font-size:19px;font-weight:900}.status,.diag{margin:14px 0;padding:13px;background:#f3efe6;border-radius:12px;line-height:1.65}.diag div{padding:4px 0;border-bottom:1px dashed #c8bcad}.diag div:last-child{border:0}.ok{font-weight:900}.note{font-size:13px;color:#6b6157}</style></head><body><main><h1>韓国語アプリ</h1><p>Androidインストール診断 Ver.3.3.1</p><div class="status" id="status">Chromeのインストール判定を確認しています。</div><div class="diag"><div id="secure">HTTPS：確認中</div><div id="sw">Service Worker：確認中</div><div id="ctrl">SW制御：確認中</div><div id="manifest">Manifest：確認中</div><div id="icons">アイコン：確認中</div><div id="mode">起動状態：確認中</div><div id="prompt">インストールイベント：待機中</div></div><button id="install" hidden>📱 韓国語アプリをインストール</button><button onclick="location.href='./?v=3310'">アプリを開く</button><p class="note">インストールボタンが出ない場合も、この画面の診断結果で原因を切り分けできます。</p></main><script>const $=id=>document.getElementById(id);let promptEvent=null;const status=$('status'),btn=$('install');$('secure').textContent='HTTPS：'+(isSecureContext?'正常':'異常');$('mode').textContent='起動状態：'+(matchMedia('(display-mode: standalone)').matches?'standalone（インストール済み）':'ブラウザ');async function check(){try{const r=await fetch('./manifest-install-v33.webmanifest?diag=331',{cache:'no-store'}),m=await r.json();$('manifest').textContent='Manifest：'+(r.ok&&m.display==='standalone'&&m.start_url&&m.scope?'正常':'要確認');const sizes=(m.icons||[]).map(x=>x.sizes);$('icons').textContent='アイコン：'+(sizes.includes('192x192')&&sizes.includes('512x512')?'192/512 設定済み':'要確認')}catch(e){$('manifest').textContent='Manifest：読込失敗';$('icons').textContent='アイコン：確認不可'}if(!('serviceWorker'in navigator)){$('sw').textContent='Service Worker：非対応';return}try{await navigator.serviceWorker.register('./sw.js?v=3310',{updateViaCache:'none'});await navigator.serviceWorker.ready;$('sw').textContent='Service Worker：動作中';$('ctrl').textContent='SW制御：'+(navigator.serviceWorker.controller?'制御中':'未制御（1回再読込）');if(!navigator.serviceWorker.controller&&!sessionStorage.getItem('korDiagReload')){sessionStorage.setItem('korDiagReload','1');location.reload()}}catch(e){$('sw').textContent='Service Worker：登録失敗';$('ctrl').textContent='SW制御：不可'}}window.addEventListener('beforeinstallprompt',e=>{promptEvent=e;$('prompt').textContent='インストールイベント：受信済み';status.textContent='インストールできます。下のボタンを押してください。';btn.hidden=false});btn.onclick=async()=>{if(!promptEvent)return;await promptEvent.prompt();const c=await promptEvent.userChoice;status.textContent=c.outcome==='accepted'?'インストール処理を開始しました。':'今回はキャンセルされました。';promptEvent=null};window.addEventListener('appinstalled',()=>{status.textContent='インストール完了。ホーム画面の「韓国語」から起動してください。';$('prompt').textContent='インストールイベント：インストール完了';btn.hidden=true});check();setTimeout(()=>{if(!promptEvent&&!matchMedia('(display-mode: standalone)').matches){$('prompt').textContent='インストールイベント：未受信';status.textContent='診断完了。下の各項目を確認してください。'}},5000);</script></body></html>
