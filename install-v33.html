<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#65584d"><link rel="manifest" href="./manifest-install-v33.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><title>韓国語アプリ インストール</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f3efe6;color:#302a24;margin:0;padding:22px;max-width:680px}main{background:#fffaf3;border:2px solid #8f8375;border-radius:18px;padding:20px}h1{font-size:26px}button{width:100%;min-height:64px;margin-top:14px;border:0;border-radius:14px;background:#65584d;color:white;font-size:19px;font-weight:900}.status{margin:18px 0;padding:14px;background:#f3efe6;border-radius:12px;line-height:1.7}</style></head><body><main><h1>韓国語アプリ</h1><p>Androidインストール専用 Ver.3.3</p><div class="status" id="status">Chromeのインストール判定を待っています。</div><button id="install" hidden>📱 韓国語アプリをインストール</button><button onclick="location.href='./?v=3300'">アプリを開く</button></main><script>let promptEvent=null;const status=document.getElementById('status'),btn=document.getElementById('install');window.addEventListener('beforeinstallprompt',e=>{promptEvent=e;status.textContent='インストールできます。上部のChrome案内、または下のボタンからインストールしてください。';btn.hidden=false});btn.onclick=async()=>{if(!promptEvent)return;await promptEvent.prompt();const choice=await promptEvent.userChoice;status.textContent=choice.outcome==='accepted'?'インストール処理を開始しました。':'今回はキャンセルされました。';promptEvent=null};window.addEventListener('appinstalled',()=>{status.textContent='インストール完了。ホーム画面の「韓国語」アイコンから起動してください。';btn.hidden=true});if(matchMedia('(display-mode: standalone)').matches)status.textContent='すでにアプリとして起動しています。';if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=3300',{updateViaCache:'none'});</script></body></html>
