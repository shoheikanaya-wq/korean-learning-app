<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#65584d"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="../icons/icon-192.png"><title>韓国語 PWA独立テスト</title><style>body{font-family:system-ui,sans-serif;background:#f3efe6;color:#302a24;margin:0;padding:20px}main{max-width:600px;margin:auto;background:#fffaf3;border:2px solid #8f8375;border-radius:18px;padding:20px}h1{font-size:25px}.box{background:#f3efe6;border-radius:12px;padding:14px;line-height:1.8;margin:14px 0}button{width:100%;min-height:64px;border:0;border-radius:14px;background:#65584d;color:white;font-size:19px;font-weight:800;margin-top:12px}</style></head><body><main><h1>韓国語アプリ PWA独立テスト</h1><p>既存アプリから完全に分離したインストール確認用です。</p><div class="box" id="state">初期化中…</div><button id="tap">① ここを1回タップ</button><button id="install" hidden>② 韓国語テストアプリをインストール</button></main><script>const s=document.getElementById('state'),tap=document.getElementById('tap'),install=document.getElementById('install');let deferred=null,seconds=0,tapped=false;function draw(){s.innerHTML='HTTPS：'+(isSecureContext?'正常':'異常')+'<br>専用SW：'+(navigator.serviceWorker&&navigator.serviceWorker.controller?'制御中':'確認中')+'<br>閲覧：'+seconds+'秒 / 30秒'+(seconds>=30?' ✓':'')+'<br>タップ：'+(tapped?'済み ✓':'未')+'<br>install event：'+(deferred?'受信済み ✓':'未受信');}tap.onclick=()=>{tapped=true;tap.textContent='✓ タップ済み';draw()};setInterval(()=>{seconds++;draw()},1000);window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;install.hidden=false;draw()});install.onclick=async()=>{if(!deferred)return;await deferred.prompt();await deferred.userChoice;deferred=null;draw()};window.addEventListener('appinstalled',()=>{s.innerHTML='インストール完了 ✓<br>ホーム画面から起動してください。';install.hidden=true});if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(()=>navigator.serviceWorker.ready).then(()=>{if(!navigator.serviceWorker.controller&&!sessionStorage.getItem('isoReload')){sessionStorage.setItem('isoReload','1');location.reload()}draw()}).catch(e=>{s.textContent='専用SW登録失敗: '+e.message})}draw();</script></body></html>
