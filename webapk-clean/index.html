<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#65584d"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="../icons/icon-192.png"><title>韓国語 WebAPK クリーンテスト</title><style>body{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;margin:0;background:#f3efe6;color:#302a24;padding:20px}main{max-width:560px;margin:auto;background:#fffaf3;border:2px solid #b9aa98;border-radius:22px;padding:20px;text-align:center}h1{font-size:26px}.box{background:#f3efe6;border-radius:14px;padding:14px;text-align:left;line-height:1.7;font-size:16px}button{width:100%;min-height:66px;margin-top:14px;border:0;border-radius:16px;background:#65584d;color:white;font-size:20px;font-weight:900}</style></head><body><main><h1>韓国語 WebAPK クリーンテスト</h1><p>既存版とは別の、最小構成だけでChromeのWebAPK判定を確認します。</p><div id="state" class="box">初期化中…</div><button id="install">インストール判定を確認</button></main><script>let promptEvent=null;const s=document.getElementById('state'),b=document.getElementById('install');function render(extra=''){s.innerHTML=['HTTPS: '+(isSecureContext?'OK':'NG'),'Service Worker: '+('serviceWorker'in navigator?'対応':'非対応'),'beforeinstallprompt: '+(promptEvent?'受信':'未受信'),extra].filter(Boolean).join('<br>')}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;render('Chromeがインストール候補として認識しました。');b.textContent='韓国語テストアプリをインストール'});window.addEventListener('appinstalled',()=>render('インストール完了'));if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(()=>navigator.serviceWorker.ready).then(()=>render('Service Worker ready: OK')).catch(e=>render('SW error: '+e.message))}else render();b.onclick=async()=>{if(promptEvent){promptEvent.prompt();await promptEvent.userChoice;promptEvent=null;render();return}render('現時点でChromeはインストール候補を返していません。')};</script></body></html>
