<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#65584d"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><title>韓国語アプリをインストール</title><style>:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f3efe6;color:#302a24}*{box-sizing:border-box}body{margin:0;padding:22px 15px}.card{max-width:560px;margin:auto;text-align:center;background:#fbf7ef;border:2px solid #b9aa98;border-radius:24px;padding:24px 18px}.icon{width:128px;height:128px;border-radius:28px}h1{font-size:27px;line-height:1.35;margin-bottom:8px}.ver{font-size:15px;color:#7a6d62;margin-top:0}.lead{font-size:18px;line-height:1.6}.install{width:100%;min-height:70px;border:0;border-radius:17px;background:#65584d;color:#fffaf3;font-size:22px;font-weight:900;padding:14px;margin:14px 0}.status{font-size:17px;font-weight:800;line-height:1.55;background:#f3efe6;border-radius:14px;padding:14px}.diag{margin-top:14px;text-align:left;font-size:14px;line-height:1.6;background:#fffdf8;border-radius:12px;padding:12px}.ok{font-weight:800}.open{display:block;margin-top:18px;font-size:18px;color:#51453c;font-weight:800}</style></head><body><main class="card"><img class="icon" src="./icons/icon-512.png" alt="韓国語アプリアイコン"><h1>韓国語アプリ</h1><p class="ver">WebAPK install check v3.3.1</p><p class="lead">旧版と同じChromeのWebAPK方式を優先します。APKファイルは使いません。</p><button id="install" class="install">インストール可否を確認</button><div id="status" class="status">このボタンを1回押してください。Chromeの現在の判定をその場で確認します。</div><div id="diag" class="diag">確認中…</div><a class="open" href="./">Web版を開く</a></main><script>let deferredPrompt=null;const btn=document.getElementById('install'),status=document.getElementById('status'),diag=document.getElementById('diag');const lines=[];function add(t){lines.push(t);diag.innerHTML=lines.map(x=>'・'+x).join('<br>')}function installed(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}async function checks(){add(location.protocol==='https:'?'HTTPS: OK':'HTTPS: NG');add('Chrome/Android判定: '+(navigator.userAgent.includes('Android')?'Android':'その他'));try{const r=await fetch('./manifest.webmanifest',{cache:'no-store'});add(r.ok?'manifest: OK':'manifest: NG')}catch(e){add('manifest: NG')}if('serviceWorker'in navigator){try{const reg=await navigator.serviceWorker.register('./sw.js');add('Service Worker登録: OK');await navigator.serviceWorker.ready;add('Service Worker ready: OK')}catch(e){add('Service Worker: NG')}}else add('Service Worker: 非対応');add(installed()?'表示モード: インストール済み':'表示モード: ブラウザ')}checks();window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;add('beforeinstallprompt: 受信');btn.textContent='韓国語アプリをインストール';status.textContent='Chromeからインストール許可が届いています。ボタンを押してください。'});btn.addEventListener('click',async()=>{if(installed()){status.textContent='すでにアプリとして起動しています。';return}if(typeof navigator.install==='function'){try{status.textContent='Chromeの新しいWeb Install APIを試しています…';await navigator.install();return}catch(e){add('Web Install API: 利用不可/失敗')}}if(deferredPrompt){deferredPrompt.prompt();const choice=await deferredPrompt.userChoice;status.textContent=choice.outcome==='accepted'?'インストールを開始しました。完了すると「韓国語」アイコンが追加されます。':'インストールはキャンセルされました。';deferredPrompt=null;return}status.textContent='待つ必要はありません。現在Chromeが自動インストール候補を返していません。この表示のスクショを送れば、次の原因切り分けに進めます。';add('beforeinstallprompt: 未受信');add('Web Install API: '+(typeof navigator.install==='function'?'あり':'なし'))});window.addEventListener('appinstalled',()=>{btn.textContent='インストール完了';status.textContent='完了。「韓国語」アイコンから起動できます。';add('appinstalled: 受信')});</script></body></html>
