<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#65584d"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-192.png"><title>韓国語アプリをインストール</title><style>:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f3efe6;color:#302a24}*{box-sizing:border-box}body{margin:0;padding:22px 15px}.card{max-width:560px;margin:auto;text-align:center;background:#fbf7ef;border:2px solid #b9aa98;border-radius:24px;padding:24px 18px}.icon{width:128px;height:128px;border-radius:28px}h1{font-size:27px;line-height:1.35}.lead{font-size:18px;line-height:1.6}.install{width:100%;min-height:70px;border:0;border-radius:17px;background:#65584d;color:#fffaf3;font-size:22px;font-weight:900;padding:14px;margin:14px 0}.install:disabled{opacity:.48}.status{font-size:17px;font-weight:800;line-height:1.55;background:#f3efe6;border-radius:14px;padding:14px}.open{display:block;margin-top:18px;font-size:18px;color:#51453c;font-weight:800}</style></head><body><main class="card"><img class="icon" src="./icons/icon-512.png" alt="韓国語アプリアイコン"><h1>韓国語アプリ</h1><p class="lead">APKは使いません。Chromeの正規PWAインストール機能を使います。</p><button id="install" class="install" disabled>インストール準備中…</button><div id="status" class="status">この画面をChromeで開いたまま少し待ってください。</div><a class="open" href="./">Web版を開く</a></main><script>let deferredPrompt=null;const btn=document.getElementById('install'),status=document.getElementById('status');if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}function installed(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}if(installed()){btn.textContent='インストール済み';status.textContent='すでにアプリとして起動しています。';}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;btn.disabled=false;btn.textContent='韓国語アプリをインストール';status.textContent='準備できました。上のボタンを押してください。';});btn.addEventListener('click',async()=>{if(!deferredPrompt){status.textContent='まだChromeからインストール許可が届いていません。少し待ってから再読み込みしてください。';return;}deferredPrompt.prompt();const choice=await deferredPrompt.userChoice;if(choice.outcome==='accepted'){status.textContent='インストールを開始しました。完了すると「韓国語」アイコンが追加されます。';}else{status.textContent='インストールはキャンセルされました。';}deferredPrompt=null;btn.disabled=true;});window.addEventListener('appinstalled',()=>{btn.textContent='インストール完了';btn.disabled=true;status.textContent='インストール完了。「韓国語」アイコンから起動できます。';});setTimeout(()=>{if(!deferredPrompt&&!installed())status.textContent='ボタンが有効にならない場合は、Chrome側がまだインストール可能と判定していません。APKの危険警告を無視する必要はありません。';},5000);</script></body></html>
