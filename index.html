];let soundIdx=0;function renderSoundStats(){const x=soundRecords()[soundIdx];$('soundStats').textContent=x?'練習 '+x.tries+'回　直近 '+x.last+'%　最高 '+x.best+'%':'練習記録：まだありません'}function soundRecords(){try{return JSON.parse(localStorage.getItem('korSoundStats')||'{}')}catch(e){return{}}}function saveSoundScore(i,score){const s=soundRecords(),x=s[i]||{tries:0,best:0,last:0};x.tries++;x.last=score;x.best=Math.max(x.best,score);s[i]=x;localStorage.setItem('korSoundStats',JSON.stringify(s))}function renderSound(){const d=soundDrills[soundIdx],x=soundRecords()[soundIdx];$('soundTitle').textContent=(soundIdx+1)+' / '+soundDrills.length+'　'+d.t;$('soundKo').textContent=d.show;$('soundAction').textContent=d.action;$('soundTip').textContent=d.tip;$('soundSpeak').textContent='🎤 今回の音「'+d.target+'」を発音する';$('soundListen').textContent=d.listen.length===3?'🔊 ① '+d.listen[0]+'　② '+d.listen[1]+'　③ '+d.listen[2]+' を順番に聞く':d.listen.length===2?'🔊 '+d.listen.join(' → ')+' を聞き比べる':'🔊 単語全体のお手本を聞く';$('soundStatus').textContent='今回あなたが発音する音は「'+d.target+'」です。お手本を聞いてから話してください。';$('soundStats').textContent=x?'練習 '+x.tries+'回　直近 '+x.last+'%　最高 '+x.best+'%':'練習記録：まだありません'}$('soundStart').onclick=()=>{soundIdx=0;show('soundPage');renderSound();setTimeout(renderVoiceStatus,150)};function shortVoiceName(v){return v?'韓国語音声':'なし'}function renderVoiceStatus(){const p=voicePair();$('voiceStatus').textContent=!p.a?'韓国語の音声が見つかりません':'会話音声：固定の別人音声を優先／未登録は端末音声'}$('voiceA').onclick=()=>{say('안녕하세요. 저는 여자 역할이에요.',.9,0);renderVoiceStatus()};$('voiceANext').onclick=()=>{if(cycleVoice('a')){renderVoiceStatus();say('안녕하세요. 여성 목소리예요.',.9,0)}else $('voiceStatus').textContent='この端末にはA/Bを分けられる韓国語音声が足りません'};$('voiceB').onclick=()=>{say('안녕하세요. 저는 남자 역할이에요.',.9,1);renderVoiceStatus()};$('voiceBNext').onclick=()=>{if(cycleVoice('b')){renderVoiceStatus();say('안녕하세요. 남성 목소리예요.',.9,1)}else $('voiceStatus').textContent='この端末にはA/Bを分けられる韓国語音声が足りません'};$('voiceAB').onclick=()=>{say('안녕하세요. 저는 여자 역할이에요.',.9,0,()=>setTimeout(()=>say('안녕 ngClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.onpointerdown=e=>{drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()};c.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()};window.addEventListener('pointerup',()=>drawing=false);function clearPad(){ctx.clearRect(0,0,c.width,c.height)}$('clear').onclick=clearPad;$('aiStart').onclick=()=>show('aiPage');$('aiBack').onclick=()=>show('home');$('aiTalk').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('aiStatus').textContent='この端末では音声入力を使えません';return}const r=new SR();r.lang='ko-KR';$('aiStatus').textContent='🎤 …';r.onresult=e=>{$('aiStatus').textContent='あなた：'+e.results[0][0].transcript;setTimeout(()=>say('좋아요. 계속 이야기해 주세요.',1,1),300)};r.onerror=()=>{$('aiStatus').textContent='もう一度 🎤'};r.start()};show('home')})();</script><script>if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js?v=312360',{updateViaCache:'none'}).catch(()=>{})}</script></body></html>
