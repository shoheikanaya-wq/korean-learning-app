#f4e7bd;border-radius:999px;padding:4px 8px}.writeguide{font-size:15px;font-weight:750}.trace-pad{position:relative;width:min(100%,320px);aspect-ratio:1;margin:auto;background:#fffdf8;border:2px solid #8f8375;border-radius:14px;overflow:hidden}.trace-pad canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.trace-pad #writebox{touch-action:none}.trace-options{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.trace-options select{min-height:42px}.trace-options input{width:21px;height:21px}.writeactions{grid-template-columns:1fr 1fr;margin-top:7px}.writeactions button{min-height:48px}.writeanswer{display:none;margin-top:7px;padding:9px;border-radius:10px;background:#f4e7bd;font-weight:800}.writeanswer.show{display:block}#traceProgress{text-align:center;font-weight:850}.bubble{margin:7px 0;padding:11px;border-radius:13px;background:#e8efee;font-size:18px;font-weight:800}.bubble.b{background:#f3e8df}.speaking{outline:3px solid #65584d}.conv{width:100%;min-height:52px;margin-top:6px}.convMode{width:100%;min-height:48px;margin-bottom:6px}.convFeedback{display:none;margin-top:7px;padding:9px;background:#ece8e1;border-radius:10px;font-weight:750}.voice-settings{margin-top:10px;padding:8px;border:1px solid #8f8375;border-radius:10px}.voice-settings summary{font-weight:850}.voice-settings select{width:100%;min-height:42px}.voice-tests{grid-template-columns:1fr 1fr}.voice-tests button{min-height:46px}.progress,.done{text-align:center;font-weight:800}.progress{margin:8px 0 3px}.done{font-size:13px;color:#5c534a}.nav{grid-template-columns:1fr 1.35fr;margin-top:7px}.appfooter{margin-top:14px;padding-top:10px;border-top:1px solid #c9beb0;text-align:center;font-size:12px;color:#6f655b}.share{margin-top:8px;min-height:44px;padding:0 14px}@media(max-width:520px){body{padding:8px}.title h1{font-size:22px}.category{min-height:94px}.category strong{font-size:22px}.ko{font-size:41px}.ja{font-size:22px}.mora{font-size:29px}.listenrow button,.nav button{min-height:58px;font-size:18px}.homeReview{grid-template-columns:1fr}.card{padding:10px}}</style></head><body><header class="title"><h1>韓国語 実践トレーニング</h1><span class="version">Ver.3.12.6</span></header><section id="home"><p class="homelead">読む・聞く・話す・書くを、1画面で実践します。</p><div class="categorygrid"><button class="category" data-start="daily"><strong>🏠 日常会話</strong><span>毎日使う表現を実践</span></button><button class="category" data-start="travel"><strong>✈️ トラベル韓国語</strong><span>空港・ホテル・交通・食事・買い物</span></button><button class="category" data-start="business"><strong>💼 ビジネス韓国語</strong><span>仕事・会議・工場・設備保全</span></button></div><div class="homeReview"><button id="homeWeak">🔁 要復習を練習</button><button id="homeAdaptive">✨ おすすめ練習</button></div><div id="homeSummary" class="homeSummary"></div></section><section id="lesson" class="lesson"><div class="lessonTop"><button id="homeBtn" class="homebtn">← ホーム</button><div id="catName" class="catname"></div></div><div class="tabs"><button data-c="daily">日常</button><button data-c="travel">トラベル</button><button data-c="business">ビジネス</button></div><div class="topnav"><button id="topPrev">← 前へ</button><button id="topNext" class="primary">できた・次へ →</button></div><select id="scene" class="scene"></select><div class="reviewtools"><button id="weakNext">要復習へ</button><button id="adaptive">おすすめへ</button></div><main class="card"><div id="ko" class="ko"></div><div class="pronwrap"><div id="pron" class="pron"></div></div><div id="ja" class="ja"></div><div class="listenrow"><button id="listen" class="listen">🔊 お手本を聞く</button><button id="slow" class="slow">🐢 ゆっくり</button></div><button id="speak" class="speak">🎤 私も話す</button><div id="feedback" class="feedback"></div><div id="scoreLine" class="scoreline"></div><section class="writing"><div class="sectionhead"><h3>✍️ 書いてみる</h3><span class="tag">手書き</span></div><p class="writeguide">まず見本をなぞり、慣れたら見本なしへ自動で進みます。1文字ずつ練習します。</p><div id="traceProgress"></div><div class="trace-pad"><canvas id="traceGuide" width="320" height="320"></canvas><canvas id="writebox" width="320" height="320"></canvas></div><div class="trace-options"><label>判定 <select id="traceLevel"><option value="easy">甘め</option><option value="normal">標準</option></select></label><label><input id="traceAuto" type="checkbox" checked> 自動で次へ</label></div><div class="writeactions"><button id="tracePrev">← 1文字前</button><button id="traceNext">次の文字 →</button><button id="clear">書き直す</button><button id="check">判定</button><button id="hide">見ないで挑戦</button></div><div id="writeanswer" class="writeanswer"></div></section><section class="mini"><h3>💬 ミニ会話</h3><select id="convMode" class="convMode"><option value="app">AもBもアプリ</option><option value="userA">私がAを話す</option><option value="userB">私がBを話す</option></select><div id="bubbleA" class="bubble"></div><div id="bubbleB" class="bubble b"></div><button id="conv" class="conv">▶ 会話を練習</button><div id="convFeedback" class="convFeedback"></div></section></main><div id="progress" class="progress"></div><div id="done" class="done"></div><div class="nav"><button id="prev">← 前へ</button><button id="next" class="primary">できた・次へ →</button></div></section><footer class="appfooter"><div>韓国語 実践トレーニング Ver.3.12.6</div><div>Personal Korean Learning Project / © 2026 S.K.</div><button id="shareApp" class="share">このアプリを共有</button><div id="shareStatus"></div></footer><script src="./lessons.js?v=31260"></script><script src="./lessons-extra.js?v=31260"></script><script src="./practice-tools.js?v=31260"></script><script src="./today-summary.js?v=31260"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),names={daily:'日常会話',travel:'トラベル韓国語',business:'ビジネス韓国語'};let cat='daily',idx=0;const saved=()=>{try{return JSON.parse(localStorage.getItem('korProgress')||'{}')}catch{return{}}},store=o=>{try{localStorage.setItem('korProgress',JSON.stringify(o))}catch{}};function key(){return cat+':'+idx}function lessons(){return window.LESSONS?.[cat]||[]}function allLessonCount(){return ['daily','travel','business'].reduce((n,c)=>n+(window.LESSONS?.[c]?.length||0),0)}function updateHomeSummary(){const p=saved();let done=0,weak=0,bestScores=[];for(const c of ['daily','travel','business']){const L=window.LESSONS?.[c]||[];for(let i=0;i<L.length;i++){const s=p[c+':'+i]||{};if(s.done)done++;if(!s.done||(Number.isFinite(s.bestScore)&&s.bestScore<70))weak++;if(Number.isFinite(s.bestScore))bestScores.push(s.bestScore)}}const avg=bestScores.length?Math.round(bestScores.reduce((a,b)=>a+b,0)/bestScores.length):null;$('homeSummary').textContent=`進み具合：${done}/${allLessonCount()}　要復習：${weak}${avg!==null?'　発音ベスト平均：'+avg+'点':''}`}function toneToLevels(t){const parts=(t||'').trim().split(/\s+/).filter(Boolean);return parts.map(x=>x.includes('↴')?2:x.includes('↵')?-2:x.includes('↗')?1:x.includes('↘')?-1:0)}function morae(s){const out=[];for(const ch of Array.from(s||'')){if(/[ァィゥェォャュョヮー]/.test(ch)&&out.length&&out[out.length-1]!==' '){out[out.length-1]+=ch}else{out.push(ch)}}return out}function renderPron(k,t){const m=morae(k),lv=toneToLevels(t);let j=0;return m.map(x=>{if(x===' ')return'<span class="space"></span>';const v=lv[Math.min(j,lv.length-1)]||0;j++;const cls=v===2?'p-high':v===-2?'p-low':v===1?'p-rise':v===-1?'p-fall':'';const ar=v===2?'↑':v===-2?'↓':v===1?'↗':v===-1?'↘':'';return `<span class="mora ${cls}">${x}${ar?`<span class="pitch-arrow">${ar}</span>`:''}</span>`}).join('')}function render(){const L=lessons(),d=L[idx]||L[0];if(!d)return;$('catName').textContent=names[cat];document.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('on',b.dataset.c===cat));$('scene').innerHTML=L.map((x,i)=>`<option value="${i}" ${i===idx?'selected':''}>${i+1}. ${x[0]}</option>`).join('');$('ko').textContent=d[1];$('pron').innerHTML=renderPron(d[2],d[3]);$('ja').textContent=d[4];$('bubbleA').textContent='A　'+d[5];$('bubbleB').textContent='B　'+d[6];const p=saved(),s=p[key()]||{},done=s.done?'✓ できた':'未完了';$('progress').textContent=`${idx+1} / ${L.length}`;$('done').textContent=done;$('scoreLine').textContent=Number.isFinite(s.bestScore)?`発音ベスト：${s.bestScore}点${Number.isFinite(s.lastScore)?'　直近：'+s.lastScore+'点':''}`:'発音はまだ未採点';$('feedback').className='feedback';$('feedback').textContent='';$('convFeedback').style.display='none';window.KorTrace?.reset()}function open(c,i=0){cat=c;idx=Math.max(0,Math.min(i,(window.LESSONS[c]||[]).length-1));$('home').style.display='none';$('lesson').style.display='block';render();scrollTo({top:0,behavior:'smooth'})}function home(){$('lesson').style.display='none';$('home').style.display='block';window.KorSpeech?.cancel();updateHomeSummary();window.KorToday?.render()}function markDone(){const p=saved();p[key()]={...(p[key()]||{}),done:true,last:Date.now()};store(p)}function move(n,mark=false){if(mark)markDone();const L=lessons();if(!L.length)return;idx=(idx+n+L.length)%L.length;render()}function needsReview(s){return !s?.done||(Number.isFinite(s.bestScore)&&s.bestScore<70)}function weak(){const p=saved();for(const c of ['daily','travel','business']){const L=window.LESSONS[c]||[];for(let i=0;i<L.length;i++)if(needsReview(p[c+':'+i])){open(c,i);return}}open('daily',0)}function adaptive(){const p=saved();let best=null;for(const c of ['daily','travel','business']){const L=window.LESSONS[c]||[];for(let i=0;i<L.length;i++){const s=p[c+':'+i]||{};const score=Number.isFinite(s.bestScore)?s.bestScore:-1;const rank=score+(s.done?40:0);if(!best||rank<best.rank)best={c,i,rank}}}open(best?.c||'daily',best?.i||0)}function speakNative(text,rate=.82,pitch=1){const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=rate;u.pitch=pitch;speechSynthesis.cancel();speechSynthesis.speak(u)}function norm(s){return(s||'').toLowerCase().replace(/[\s.,!?！？。、]/g,'')}function lev(a,b){a=norm(a);b=norm(b);const d=Array.from({length:b.length+1},()=>Array(a.length+1).fill(0));for(let i=0;i<=b.length;i++)d[i][0]=i;for(let j=0;j<=a.length;j++)d[0][j]=j;for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[j-1]===b[i-1]?0:1));return d[b.length][a.length]}function scoreSpoken(got,target){const max=Math.max(norm(got).length,norm(target).length,1);return Math.max(0,Math.min(100,Math.round(100*(1-lev(got,target)/max))))}function recognize(target,cb){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){cb(null,'この端末では音声認識を利用できません。Chromeで開いてください。');return}const r=new SR();r.lang='ko-KR';r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>cb(e.results[0][0].transcript);r.onerror=e=>cb(null,'音声認識エラー: '+e.error);r.start()}function practice(){const d=lessons()[idx],f=$('feedback');f.className='feedback show';f.textContent='聞き取っています…';recognize(d[1],(got,err)=>{if(err){f.textContent=err;return}const s=scoreSpoken(got,d[1]),p=saved(),old=p[key()]||{};p[key()]={...old,lastScore:s,bestScore:Math.max(Number.isFinite(old.bestScore)?old.bestScore:0,s),last:Date.now()};store(p);f.innerHTML=`<span class="score">${s}点</span><br>聞き取り：${got}<br>${s>=85?'とても良いです。':s>=70?'合格ラインです。もう一度でさらに上を狙えます。':'要復習に入れました。お手本→ゆっくり→もう一度の順で練習しましょう。'}`;renderScoreOnly();window.KorToday?.render()})}function renderScoreOnly(){const s=saved()[key()]||{};$('scoreLine').textContent=Number.isFinite(s.bestScore)?`発音ベスト：${s.bestScore}点${Number.isFinite(s.lastScore)?'　直近：'+s.lastScore+'点':''}`:'発音はまだ未採点'}function conversation(){const d=lessons()[idx],mode=$('convMode').value,out=$('convFeedback');out.style.display='block';if(mode==='app'){out.textContent='A → B の順で再生します';if(window.KorSpeech){window.KorSpeech.cancel();window.KorSpeech.speak(d[5],0,()=>window.KorSpeech.speak(d[6],1))}else{speakNative(d[5]);setTimeout(()=>speakNative(d[6],.92,1),1600)}return}const userIsA=mode==='userA',target=userIsA?d[5]:d[6],appText=userIsA?d[6]:d[5],appRole=userIsA?1:0;if(!userIsA&&window.KorSpeech){window.KorSpeech.speak(appText,appRole,()=>recognize(target,(got,err)=>{out.textContent=err||`${scoreSpoken(got,target)}点　聞き取り：${got}`}))}else{recognize(target,(got,err)=>{if(err){out.textContent=err;return}out.textContent=`${scoreSpoken(got,target)}点　聞き取り：${got}`;window.KorSpeech?window.KorSpeech.speak(appText,appRole):speakNative(appText)})}}document.querySelectorAll('[data-start]').forEach(b=>b.addEventListener('click',()=>open(b.dataset.start)));document.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>open(b.dataset.c)));$('homeBtn').addEventListener('click',home);$('scene').addEventListener('change',e=>{idx=+e.target.value;render()});$('prev').addEventListener('click',()=>move(-1));$('topPrev').addEventListener('click',()=>move(-1));$('next').addEventListener('click',()=>move(1,true));$('topNext').addEventListener('click',()=>move(1,true));$('listen').addEventListener('click',()=>{const d=lessons()[idx];window.KorSpeech?.cancel();window.KorSpeech?window.KorSpeech.speak(d[1],0):speakNative(d[1])});$('slow').addEventListener('click',()=>{const d=lessons()[idx];window.KorSpeech?.cancel();window.KorSpeech?window.KorSpeech.speak(d[1],0):speakNative(d[1],.62,1)});$('speak').addEventListener('click',practice);$('conv').addEventListener('click',conversation);$('homeWeak').addEventListener('click',weak);$('weakNext').addEventListener('click',weak);$('homeAdaptive').addEventListener('click',adaptive);$('adaptive').addEventListener('click',adaptive);$('convMode').addEventListener('change',e=>{try{localStorage.setItem('korConvMode',e.target.value)}catch{}});try{$('convMode').value=localStorage.getItem('korConvMode')||'app'}catch{};updateHomeSummary();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=31260').catch(()=>{});})();</script></body></html>
