<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f1e8"><link rel="manifest" href="./manifest.webmanifest?v=312110"><link rel="apple-touch-icon" href="./icons/icon-192.png"><title>韓国語</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#211d19;background:#f5f1e8}*{box-sizing:border-box}body{margin:auto;max-width:720px;padding:12px;background:#f5f1e8}button{font:inherit;cursor:pointer;border:3px solid #4e463e;border-radius:20px;background:#fff;color:#211d19;font-weight:900}.hide{display:none!important}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head b{font-size:26px}.ver{font-size:15px;font-weight:900}.grid{display:grid;gap:16px}.cat{min-height:112px;font-size:30px;text-align:left;padding:20px}.cat small{display:block;font-size:18px;margin-top:5px}.ai{background:#332e29;color:#fff}.lessonHead{display:flex;gap:10px;align-items:center}.back{min-height:58px;padding:0 18px;font-size:20px}.where{font-size:22px;font-weight:900}.card{margin-top:12px;padding:18px;border:3px solid #8d8175;border-radius:24px;background:#fffdf8}.ko{text-align:center;font-size:52px;font-weight:950;line-height:1.2;margin:8px 0}.pron{text-align:center;font-size:32px;font-weight:950;line-height:1.5;margin:8px 0}.ja{text-align:center;font-size:27px;font-weight:900;margin:8px 0 18px}.step{display:none}.step.on{display:block}.big{width:100%;min-height:92px;font-size:28px;margin:8px 0}.listen{background:#315f88;color:#fff}.speak{background:#8a4654;color:#fff}.write{background:#725a36;color:#fff}.next{background:#332e29;color:#fff}.sub{width:100%;min-height:62px;font-size:20px;margin:6px 0}.status{text-align:center;font-size:22px;font-weight:900;min-height:36px;margin:8px 0}.dots{display:flex;gap:8px;margin:14px 0}.dot{height:10px;flex:1;border-radius:99px;background:#d6d0c8}.dot.done,.dot.now{background:#332e29}.pad{position:relative;width:min(100%,340px);aspect-ratio:1;margin:10px auto;background:#fff;border:4px solid #4e463e;border-radius:22px;overflow:hidden}.pad canvas{position:absolute;inset:0;width:100%;height:100%}#draw{touch-action:none}.guide{position:absolute;inset:0;display:grid;place-items:center;font-size:145px;font-weight:900;color:#ded9d2;pointer-events:none}.writeBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.writeBtns button{min-height:64px;font-size:20px}.conversation{font-size:23px;font-weight:850;line-height:1.5}.bubble{padding:14px;margin:10px 0;border-radius:18px;background:#e7f0f5}.bubble.b{background:#f5e8e3}.nav{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:12px}.nav button{min-height:68px;font-size:22px}.aiBox{margin-top:20px;padding:22px;border-radius:24px;background:#fff}.aiBox h2{font-size:30px;margin-top:0}.aiBox p{font-size:22px;line-height:1.5}.footer{text-align:center;font-size:14px;font-weight:800;margin:18px 0}@media(max-width:520px){body{padding:9px}.head b{font-size:23px}.cat{min-height:104px;font-size:27px}.ko{font-size:48px}.pron{font-size:29px}.ja{font-size:25px}.card{padding:13px}.big{min-height:88px;font-size:27px}}
</style></head><body>
<header class="head"><b>韓国語</b><span class="ver">Ver.3.12.11</span></header>
<section id="home"><div class="grid"><button class="cat" data-start="daily">🏠 日常<small>毎日の会話</small></button><button class="cat" data-start="travel">✈️ 旅行<small>空港・ホテル・食事</small></button><button class="cat" data-start="business">💼 仕事<small>職場・設備・会話</small></button><button class="cat ai" id="aiStart">💬 AI会話<small>自由に話す</small></button></div></section>
<section id="lesson" class="hide"><div class="lessonHead"><button class="back" id="homeBtn">←</button><div class="where" id="where"></div></div><main class="card"><div class="ko" id="ko"></div><div class="pron" id="pron"></div><div class="ja" id="ja"></div><div class="dots"><span class="dot" id="d0"></span><span class="dot" id="d1"></span><span class="dot" id="d2"></span><span class="dot" id="d3"></span></div>

<section class="step" id="s1"><button class="big speak" id="speak">🎤 話す</button><div class="status" id="speechStatus"></div></section>
<section class="step" id="s2"><button class="big write" id="showWrite">✍️ 指で書く</button><div id="writeArea" class="hide"><div class="pad"><div class="guide" id="guide"></div><canvas id="draw" width="340" height="340"></canvas></div><div class="writeBtns"><button id="clear">↺ 書き直す</button><button id="writeOk">✓ できた</button></div></div></section>
<section class="step" id="s3"><div class="conversation"><div class="bubble" id="a"></div><div class="bubble b" id="b"></div></div><button class="big listen" id="conv">▶ 会話を聞く</button><button class="big next" id="finish">次へ ▶</button></section></main><div class="nav"><button id="prev">← 前へ</button><button class="next" id="skip">次へ ▶</button></div></section>
<section id="aiPage" class="hide"><button class="back" id="aiBack">←</button><div class="aiBox"><h2>💬 AI会話</h2><p>🎤 を押して、韓国語で自由に話します。</p><button class="big speak" id="aiTalk">🎤 話す</button><div class="status" id="aiStatus"></div></div></section>
<div class="footer">韓国語 Ver.3.12.11</div>
<script src="./lessons.js?v=312110"></script><script src="./lessons-extra.js?v=312110"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),names={daily:'🏠 日常',travel:'✈️ 旅行',business:'💼 仕事'};let cat='daily',idx=0,step=0;const L=()=>window.LESSONS?.[cat]||[];function data(){return L()[idx]||L()[0]}function show(id){['home','lesson','aiPage'].forEach(x=>$(x).classList.toggle('hide',x!==id))}function render(){const d=data();if(!d)return;$('where').textContent=names[cat]+' '+(idx+1)+' / '+L().length;$('ko').textContent=d[1];$('pron').textContent=d[2];$('ja').textContent=d[4];$('a').textContent='A　'+(d[5]||d[1]);$('b').textContent='B　'+(d[6]||'네.');$('guide').textContent=Array.from((d[1]||'').replace(/[\s.!?。！？]/g,''))[0]||'';renderStep()}function renderStep(){for(let i=0;i<4;i++){$('s'+i).classList.toggle('on',i===step);$('d'+i).className='dot '+(i<step?'done':i===step?'now':'')}$('writeArea').classList.add('hide');clearPad()}function start(c){cat=c;idx=0;step=0;show('lesson');render()}document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));$('homeBtn').onclick=()=>show('home');$('prev').onclick=()=>{if(idx>0)idx--;else idx=L().length-1;step=0;render()};$('skip').onclick=()=>{step=Math.min(3,step+1);renderStep()};function voices(){return speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang))}function say(text,rate=1,voiceNo=0,after){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=rate;const vs=voices();if(vs.length)u.voice=vs[voiceNo%vs.length];if(after)u.onend=after;speechSynthesis.speak(u)}$('listen').onclick=()=>say(data()[1],1,0,()=>{step=1;renderStep()});$('slow').onclick=()=>say(data()[1],.68,0);$('speak').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('speechStatus').textContent='🎤 聞きました';setTimeout(()=>{step=2;renderStep()},700);return}const r=new SR();r.lang='ko-KR';r.interimResults=false;$('speechStatus').textContent='🎤 …';r.onresult=e=>{const heard=e.results[0][0].transcript;$('speechStatus').textContent='✓ '+heard;setTimeout(()=>{step=2;renderStep()},900)};r.onerror=()=>{$('speechStatus').textContent='もう一度 🎤'};r.start()};$('showWrite').onclick=()=>{$('writeArea').classList.remove('hide')};$('writeOk').onclick=()=>{step=3;renderStep()};$('conv').onclick=()=>{const d=data();say(d[5]||d[1],1,0,()=>setTimeout(()=>say(d[6]||'네.',1,1),250))};$('finish').onclick=()=>{try{localStorage.setItem('kor:last',JSON.stringify({cat,idx,time:Date.now()}))}catch{}idx=(idx+1)%L().length;step=0;render();window.scrollTo({top:0,behavior:'smooth'})};
const c=$('draw'),ctx=c.getContext('2d');let drawing=false;ctx.lineWidth=10;ctx.lineCap='round';ctx.lineJoin='round';function pos(e){const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}}function down(e){drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()}function move(e){if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()}function up(){drawing=false}c.addEventListener('pointerdown',down);c.addEventListener('pointermove',move);window.addEventListener('pointerup',up);function clearPad(){ctx.clearRect(0,0,c.width,c.height)}$('clear').onclick=clearPad;
$('aiStart').onclick=()=>show('aiPage');$('aiBack').onclick=()=>show('home');$('aiTalk').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('aiStatus').textContent='この端末では音声入力を使えません';return}const r=new SR();r.lang='ko-KR';$('aiStatus').textContent='🎤 …';r.onresult=e=>{const t=e.results[0][0].transcript;$('aiStatus').textContent='あなた：'+t;setTimeout(()=>say('좋아요. 계속 이야기해 주세요.',1,1),300)};r.onerror=()=>{$('aiStatus').textContent='もう一度 🎤'};r.start()};
try{const s=JSON.parse(localStorage.getItem('kor:last')||'null');if(s&&window.LESSONS?.[s.cat]){cat=s.cat;idx=Math.min(s.idx,L().length-1)}}catch{}show('home')})();
</script></body></html>
