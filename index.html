<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#65584d"><title>韓国語 実践トレーニング</title><style>:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f3efe6;color:#302a24}*{box-sizing:border-box}body{margin:auto;max-width:760px;padding:12px;background:#f3efe6}header{display:flex;align-items:center;gap:8px}.titlewrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:24px}.version{font-size:13px;font-weight:900;padding:5px 9px;border-radius:999px;background:#222;color:#fff}.categorygrid{display:grid;gap:12px}.category{width:100%;min-height:92px;text-align:left;border:3px solid #a99884;border-radius:18px;background:#fbf7ef;padding:15px 16px;box-shadow:0 3px #a99884}.category strong{display:block;font-size:23px}.category span{font-size:16px;font-weight:700}.card{margin-top:12px;padding:16px;border:2px solid #b9aa98;border-radius:18px;background:#fbf7ef}.ko{text-align:center;font-size:44px;font-weight:900}.ja{text-align:center;font-size:21px;font-weight:800}.pronwrap{margin:13px 0;text-align:center;padding:18px 8px 10px;overflow:visible}.pron{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;min-height:108px;padding-top:30px;gap:5px;font-weight:900;overflow:visible}.mora{position:relative;display:inline-block;font-size:38px;line-height:1;font-weight:900;white-space:nowrap}.mora .pitch-arrow{position:absolute;left:50%;top:-25px;transform:translateX(-50%);font-size:20px;color:#7b5232}.prosody-high{font-size:46px;transform:translateY(-10px)}.prosody-low{font-size:30px;transform:translateY(9px)}.prosody-rise{font-size:42px;transform:translateY(-6px)}.prosody-fall{font-size:34px;transform:translateY(6px)}button{width:100%;min-height:58px;margin:5px 0;border:2px solid #8f8375;border-radius:14px;background:#fff;font-size:18px;font-weight:800}.listen{background:#5f7891;color:#fff}.speak{background:#9a5f69;color:#fff}.homelead{font-size:18px;font-weight:850}.lesson{display:none}.homebtn{width:auto;padding:0 18px}.nav{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}.primary{background:#65584d;color:#fff}.bubble{padding:11px;border-radius:13px;background:#e8efee;margin:7px 0;font-size:18px;font-weight:750}.bubble.b{background:#f3e8df}.writing,.mini{border-top:2px dashed #bbb;padding-top:13px;margin-top:15px}.trace-pad{width:min(100%,320px);aspect-ratio:1;margin:auto;background:#fffdf8;border:2px solid #8f8375;border-radius:14px}.historyline{text-align:center;font-size:13px;font-weight:750;color:#555;margin:10px}.voice-settings{display:none}@media(max-width:520px){body{padding:10px}.ko{font-size:42px}.ja{font-size:23px}.mora{font-size:34px}.prosody-high{font-size:42px}.prosody-low{font-size:27px}.prosody-rise{font-size:38px}.prosody-fall{font-size:30px}.mora .pitch-arrow{top:-23px;font-size:18px}button{min-height:60px;font-size:19px}}</style></head><body><header><div class="titlewrap"><h1>韓国語 実践トレーニング</h1><span class="version">Ver.3.8</span></div></header><section id="home"><p class="homelead">使いたい韓国語を選んで、聞く・話す・書くを一画面で練習します。</p><div class="categorygrid"><button class="category" onclick="openLesson('daily')"><strong>🏠 日常会話</strong><span>毎日使う韓国語を実践</span></button><button class="category" onclick="openLesson('travel')"><strong>✈️ トラベル韓国語</strong><span>空港・ホテル・交通・食事・買い物</span></button><button class="category" onclick="openLesson('business')"><strong>💼 ビジネス韓国語</strong><span>仕事・工場・設備でも使える表現</span></button><button class="category" onclick="openLesson('review')"><strong>🔁 復習</strong><span>もう一度練習する</span></button></div></section><section id="lesson" class="lesson"><button class="homebtn" onclick="goHome()">← ホーム</button><div class="card"><div class="ko" id="ko">안녕하세요</div><div class="pronwrap"><div class="pron" id="pron"><span class="mora prosody-high">ア<span class="pitch-arrow">↑</span></span><span class="mora prosody-low">ン</span><span class="mora prosody-rise">ニョン<span class="pitch-arrow">↗</span></span><span class="mora prosody-high">ハ<span class="pitch-arrow">↑</span></span><span class="mora prosody-fall">セヨ<span class="pitch-arrow">↓</span></span></div></div><div class="ja" id="ja">こんにちは</div><button class="listen" onclick="speakKo(.82,1)">🔊 お手本を聞く</button><button onclick="speakKo(.62,.95)">🐢 ゆっくり聞く</button><button class="speak" onclick="startPractice()">🎤 私も話す</button><div class="writing"><h3>✍️ 書いてみる</h3><div class="trace-pad"></div><p>指でハングルを書いて練習します。</p></div><div class="mini"><h3>💬 ミニ会話</h3><div class="bubble">A　안녕하세요.</div><div class="bubble b">B　안녕하세요. 반가워요.</div><button onclick="conversation()">▶ A/B会話を聞く</button></div></div><div class="historyline">Ver.3.8　カタカナを大小＋上下位置＋矢印で抑揚表示</div><div class="nav"><button>← 前へ</button><button class="primary">できた・次へ →</button></div></section><script>function openLesson(){document.getElementById('home').style.display='none';document.getElementById('lesson').style.display='block'}function goHome(){document.getElementById('lesson').style.display='none';document.getElementById('home').style.display='block'}function speakText(text,rate,pitch){if(!('speechSynthesis'in window))return;let u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=rate;u.pitch=pitch;speechSynthesis.cancel();speechSynthesis.speak(u)}function speakKo(rate,pitch){speakText(document.getElementById('ko').textContent,rate,pitch)}function conversation(){speakText('안녕하세요.',.8,.92);setTimeout(()=>speakText('안녕하세요. 반가워요.',.9,1.25),1500)}function startPractice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('この端末では音声認識を利用できません');return}let r=new SR();r.lang='ko-KR';r.start()}</script></body></html>
