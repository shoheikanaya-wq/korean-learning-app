<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#222222"><link rel="manifest" href="./manifest.webmanifest"><title>韓国語 実践トレーニング</title><style>:root{font-family:system-ui,-apple-system,sans-serif;background:#fffaf2;color:#171717}*{box-sizing:border-box}body{margin:auto;max-width:760px;padding:12px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:24px;margin:8px 0 10px}.tabs,.actions,.nav,.listenrow,.writeactions{display:grid;gap:9px}.tabs{grid-template-columns:repeat(3,1fr)}button,select,textarea{border:2px solid #222;border-radius:14px;background:#fff;font-weight:800}.tabs button,.actions button,.nav button,.listenrow button,.writeactions button,select{min-height:58px;font-size:17px}.tabs .on{background:#222;color:#fff}.scene{width:100%;padding:8px;margin-top:9px}.reviewtools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.reviewjump{width:100%;min-height:48px;border-style:dashed;background:#fff7cf}.card{margin-top:12px;padding:16px;border:2px solid #222;border-radius:18px;background:#fff;box-shadow:0 4px #222}.ko{text-align:center;font-size:44px;font-weight:900;line-height:1.25;margin-top:4px}.pronwrap{margin:13px 0 5px;text-align:center}.pron{display:flex;justify-content:center;align-items:center;gap:4px;flex-wrap:wrap;font-weight:900;line-height:1.15}.pron .p{font-size:28px}.pron .weak{font-size:20px;transform:translateY(5px)}.pron .high{transform:translateY(-4px)}.pron .low{transform:translateY(4px)}.tone{text-align:center;font-size:24px;font-weight:900;letter-spacing:4px;min-height:31px}.ja{text-align:center;font-size:21px;margin:8px 0 14px;font-weight:800}.listenrow{grid-template-columns:1.35fr .65fr}.actions{grid-template-columns:1fr 1fr;margin-top:9px}.listen{background:#2469e8!important;color:#fff}.slow{background:#eef4ff}.speak{background:#e45164!important;color:#fff}. lect id="scene" class="scene"></select><div class="reviewtools"><button id="weakNext" class="reviewjump">要復習を練習</button><button id="adaptive" class="reviewjump">おすすめ練習</button></div><main class="card"><div id="ko" class="ko"></div><div class="pronwrap"><div id="pron" class="pron"></div><div id="tone" class="tone"></div></div><div id="ja" class="ja"></div><div class="listenrow"><button id="listen" class="listen">🔊 お手本を聞く</button><button id="slow" class="slow">ゆっくり</button></div><div class="actions"><button id="speak" class="speak">🎤 発音チェック</button><button id="retry">↻ もう一度</button></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="writing"><div class="sectionhead"><b>✍ 書く練習</b><button id="hide" class="smallbtn">見ないで挑戦</button></div><div class="writeguide">最初は上を見ながらでOK。慣れたら「見ないで挑戦」で書いてみましょう。</div><textarea id="writebox" class="writebox" lang="ko" inputmode="text" autocomplete="off" placeholder="ここに韓国語を入力"></textarea><div class="writeactions"><button id="check">答え合わせ</button><button id="clear">書き直す</button></div><div id="writeanswer" class="writeanswer" aria-live="polite"></div></div><div class="mini"><div class="sectionhead"><b>ミニ会話</b><span class="tag">2人会話</span></div><div class="bubble"><div class="turn">A</div><span id="a"></span></div><div class="bubble b"><div class="turn">B</div><span id="b"></span></div><button id="conv" class="conv">▶ 会話を聞く</button></div><div id="progress" class="progress"></div><div id="done" class="done"></div><div id="history" class="historyline"></div><div class="nav"><button id="prev">← 前へ</button><button id="next" class="primary">できた・次へ →</button></div></main><script src="./lessons.js"></script><script>const D=window.LESSONS;const $=x=>document.getElementById(x);let state=JSON.parse(localStorage.getItem('korState')||'{}'),c=D[state.c]?state.c:'daily',i=Number.isInteger(state.i)?state.i:0,doneSet=new Set(JSON.parse(localStorage.getItem('korDone')||'[]')),weakSet=new Set(JSON.parse(localStorage.getItem('korWeak')||'[]')),stats=JSON.parse(localStorage.getItem('korStats')||'{}'),voices=[];function norm(x){return x.replace(/[\s.?!？！。、]/g,'')}function lev(a,b){let m=Array.from({length:b.length+1},(_,r)=>[r]);for(let j=0;j<=a.length;j++)m[0][j]=j;for(let r=1;r<=b.length;r++)for(let j=1;j<=a.length;j++)m[r][j]=b[r-1]===a[j-1]?m[r-1][j-1]:1+Math.min(m[r-1][j-1],m[r][j-1],m[r-1][j]);return m[b.length][a.length]}function similarity(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;return Math.max(0,Math.round((1-lev(a,b)/Math.max(a.length,b.length))*100))}function focusHint(heard,target){let h=norm(heard),t=norm(target);if(!h||!t||h===t)return '';let n=Math.min(h.length,t.length),pos=0;while(pos<n&&h[pos]===t[pos])pos++;let words=target.replace(/[.?!？！。、]/g,'').split(/\s+/),acc=0,pick=words[words.length-1]||target;for(let w of words){let end=acc+w.length;if(pos<=end){pick=w;break}acc=end}return `まず「${pick}」をゆっくり確認。お手本の区切りで1回まねしてから、もう一度話してみましょう。`}function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang))}loadVoices();speechSynthesis.onvoiceschanged=loadVoices;function voiceFor(n){return voices[n%Math.max(1,voices.length)]||null}function say(t,r=.9,v=0){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=r;let vv=voiceFor(v);if(vv)u.voice=vv;speechSynthesis.speak(u)}function conv(){speechSynthesis.cancel();let x=D[c][i],u1=new SpeechSynthesisUtterance(x[5]),u2=new SpeechSynthesisUtterance(x[6]);u1.lang=u2.lang='ko-KR';u1.rate=u2.rate=.84;let v1=voiceFor(0),v2=voiceFor(1);if(v1)u1.voice=v1;if(v2)u2.voice=v2;u1.onend=()=>speechSynthesis.speak(u2);speechSynthesis.speak(u1)}function renderPron(text,tone){let parts=text.split(' '),arrows=tone.split(/\s+/);$('pron').replaceChildren();parts.forEach((p,n)=>{let s=document.createElement('span');s.textContent=p;s.className='p '+(arrows[n]==='↗'?'high':arrows[n]==='↘'?'low':'');if(p.length<=2&&n>0)s.classList.add('weak');$('pron').appendChild(s)});$('tone').textContent=tone}function textNode(tag,text,cls){let e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}function showFeedback(nodes){let f=$('feedback');f.replaceChildren(...nodes);f.classList.add('show')}function updateWeak(sc){let k=c+':'+i;if(sc<75)weakSet.add(k);else if(sc>=90)weakSet.delete(k);localStorage.setItem('korWeak',JSON.stringify([...weakSet]))}function recordAttempt(sc){let k=c+':'+i,x=stats[k]||{attempts:0,best:0,last:0};x.attempts++;x.best=Math.max(x.best,sc);x.last=Date.now();stats[k]=x;localStorage.setItem('korStats',JSON.stringify(stats));$('history').textContent=`練習 ${x.attempts}回　最高 ${x.best}%`}function scenes(){i=Math.min(i,D[c].length-1);$('scene').replaceChildren(...D[c].map((x,n)=>{let o=document.createElement('option');o.value=n;o.textContent=x[0];return o}));$('scene').value=i;render()}function render(){let x=D[c][i];$('ko').textContent=x[1];renderPron(x[2],x[3]);$('ja').textContent=x[4];$('a').textContent=x[5];$('b').textContent=x[6];$('progress').textContent=`${i+1} / ${D[c].length}`;$('done').textContent=`できた：${[...doneSet].filter(k=>k.startsWith(c+':')).length} / ${D[c].length}　要復習：${[...weakSet].filter(k=>k.startsWith(c+':')).length}`;let hx=stats[c+':'+i];$('history').textContent=hx?`練習 ${hx.attempts}回　最高 ${hx.best}%`:'';$('feedback').classList.remove('show');$('feedback').replaceChildren();$('writebox').value='';$('writeanswer').classList.remove('show');$('writeanswer').replaceChildren();document.body.classList.remove('hideko');$('hide').textContent='見ないで挑戦';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.c===c));localStorage.setItem('korState',JSON.stringify({c,i}))}$('listen').onclick=()=>say(D[c][i][1],.9,0);$('slow').onclick=()=>say(D[c][i][1],.68,0);$('retry').onclick=()=>say(D[c][i][1],.78,0);$('conv').onclick=conv;$('speak').onclick=()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){showFeedback([textNode('div','この端末では音声認識が使えません。お手本を聞いて、同じ区切りで繰り返してください。')]);return}let r=new R();r.lang='ko-KR';r.interimResults=false;r.maxAlternatives=1;showFeedback([textNode('div','聞いています…')]);r.onresult=e=>{let heard=e.results[0][0].transcript,target=D[c][i][1],sc=similarity(heard,target),msg=sc>=90?'かなり近いです。':sc>=75?'伝わる形に近づいています。':sc>=55?'語尾と区切りをもう一度確認しましょう。':'短いかたまりごとに、ゆっくりまねしてみましょう。';updateWeak(sc);recordAttempt(sc);let hint=focusHint(heard,target),nodes=[textNode('div','聞き取り一致度 '+sc+'%','score'),textNode('div','聞き取り：'+heard),textNode('div',msg)];if(hint)nodes.push(textNode('div',hint));showFeedback(nodes)};r.onerror=()=>showFeedback([textNode('div','聞き取れませんでした。ゆっくりボタンで確認して、もう一度どうぞ。')]);r.start()};$('hide').onclick=()=>{let on=document.body.classList.toggle('hideko');$('hide').textContent=on?'見ながら練習':'見ないで挑戦'};$('check').onclick=()=>{let mine=$('writebox').value,target=D[c][i][1],sc=similarity(mine,target),box=$('writeanswer');box.replaceChildren();updateWeak(sc);recordAttempt(sc);let msg=!norm(mine)?'まずは韓国語を入力してみましょう。':sc===100?'◎ 正解！':sc>=80?'かなり近いです。文字や語尾を見比べてみましょう。':sc>=55?'近いところまで来ています。お手本と1文字ずつ比べてみましょう。':'上のお手本を見ながら、短く区切ってもう一度書いてみましょう。';box.append(textNode('div',msg),textNode('div','答え：'+target));box.classList.add('show')};$('clear').onclick=()=>{$('writebox').value='';$('writeanswer').classList.remove('show');$('writeanswer').replaceChildren();$('writebox').focus()};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{c=b.dataset.c;i=0;scenes()});$('scene').onchange=e=>{i=+e.target.value;render()};$('weakNext').onclick=()=>{let weak=[...weakSet].filter(k=>k.startsWith(c+':')).map(k=>+k.split(':')[1]).filter(n=>Number.isInteger(n)&&n>=0&&n<D[c].length).sort((a,b)=>a-b);if(!weak.length){showFeedback([textNode('div','このカテゴリに要復習はありません。')]);return}let next=weak.find(n=>n>i);i=next===undefined?weak[0]:next;$('scene').value=i;render()};$('adaptive').onclick=()=>{let weak=[...weakSet].filter(k=>k.startsWith(c+':')).map(k=>+k.split(':')[1]).filter(n=>Number.isInteger(n)&&n>=0&&n<D[c].length);let pool=weak.length?weak:D[c].map((_,n)=>n);pool.sort((a,b)=>{let A=stats[c+':'+a]||{attempts:0,best:0,last:0},B=stats[c+':'+b]||{attempts:0,best:0,last:0};return A.attempts-B.attempts||A.best-B.best||A.last-B.last});i=pool[0]??0;$('scene').value=i;render();showFeedback([textNode('div',weak.length?'要復習の中から優先度が高いフレーズを選びました。':'練習回数が少ないフレーズを選びました。')])};$('prev').onclick=()=>{i=(i-1+D[c].length)%D[c].length;$('scene').value=i;render()};$('next').onclick=()=>{doneSet.add(c+':'+i);localStorage.setItem('korDone',JSON.stringify([...doneSet]));i=(i+1)%D[c].length;$('scene').value=i;render()};$('mode').onclick=()=>{let on=document.body.classList.toggle('big');document.documentElement.style.fontSize=on?'120%':'100%';$('mode').textContent=on?'文字 標準':'文字 大きめ';localStorage.setItem('korBig',on?'1':'0')};if(localStorage.getItem('korBig')==='1'){document.documentElement.style.fontSize='120%';document.body.classList.add('big');$('mode').textContent='文字 標準'}if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));scenes();</script></body></html>
