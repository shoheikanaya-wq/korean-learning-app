>Ver.3.12.13</span></header><section id="home"><div class="grid"><button class="cat" data-start="daily">🏠 日常<small>順番に練習</small></button><button class="cat" data-start="travel">✈️ 旅行<small>順番に練習</small></button><button class="cat" data-start="business">💼 仕事<small>順番に練習</small></button><button class="cat wordMode" id="wordStart">🔤 単語から選ぶ<small>好きな単語をタップ</small></button><button class="cat ai" id="aiStart">💬 AI会話<small>自由に話す</small></button></div></section><section id="wordPage" class="hide"><div class="lessonHead"><button class="back" id="wordBack">←</button><div class="where">🔤 単語から選ぶ</div></div><div class="wordCats"><button data-wcat="daily">日常</button><button data-wcat="travel">旅行</button><button data-wcat="business">仕事</button></div><div id="wordList" class="wordList"></div></section><section id="lesson" class="hide"><div class="lessonHead"><button class="back" id="homeBtn">←</button><div class="where" id="where"></div></div><main class="card"><div class="ko" id="ko"></div><div class="prosody" id="prosody"></div><div class="pron" id="pron"></div><div class="ja" id="ja"></div><div class="dots"><span class="dot" id="d0"></span><span class="dot" id="d1"></span><span class="dot" id="d2"></span><span class="dot" id="d3"></span></div><section class="step" id="s0"><button class="big listen" id="listen">🔊 聞く</button><button class="sub" id="slow">🐢 ゆっくり</button></section><section class="step" id="s1"><button class="big speak" id="speak">🎤 話す</button><div class="status" id="speechStatus"></div></section><section class="step" id="s2"><button class="big write" id="showWrite">✍️ 指で書く</button><div id="writeArea" class="hide"><div class="pad"><div class="guide" id="guide"></div><canvas id="draw" width="330" height="330"></canvas></div><div class="writeBtns"><button id="clear">↺ 書き直す</button><button id="writeOk">✓ できた</button></div></div></section><section class="step" id="s3"><div class="conversation"><div class="bubble" id="a"></div><div class="bubble b" id="b"></div></div><button class="big listen" id="conv">▶ 会話を聞く</button><button class="big next" id="finish">次へ ▶</button></section></main><div id="wordNav" class="wordNav hide"><button id="wordPrev">← 前の単語</button><button id="wordNext">次の単語 →</button></div><div id="normalNav" class="normalNav"><button id="prev">← 前へ</button><button class="next" id="skip">次へ ▶</button></div></section><section id="aiPage" class="hide"><button class="back" id="aiBack">←</button><div class="aiBox"><h2>💬 AI会話</h2><button class="big speak" id="aiTalk">🎤 話す</button><div class="status" id="aiStatus"></div></div></section><div class="footer">韓国語 Ver.3.12.13</div><script src="./lessons.js?v=312130"></script><script src="./lessons-extra.js?v=312130"></script><script>(()=>{'use strict';const $=id=>document.getElementById(id),names={daily:'🏠 日常',travel:'✈️ 旅行',business:'💼 仕事'};let cat='daily',idx=0,step=0,wordMode=false;const L=()=>window.LESSONS?.[cat]||[],data=()=>L()[idx]||L()[0];function show(id){['home','lesson','aiPage','wordPage'].forEach(x=>$(x).classList.toggle('hide',x!==id))}function morae(s){const out=[];for(const ch of Array.from(s||'')){if(/[ァィゥェォャュョヮー]/.test(ch)&&out.length&&out.at(-1)!==' ')out[out.length-1]+=ch;else out.push(ch)}return out}function tone(z){if(z.includes('↴'))return'up';if(z.includes('↵'))return'down';if(z.includes('↗'))return'rise';if(z.includes('↘'))return'fall';return''}function tones(d){return(d[3]||'').trim().split(/\s+/).filter(Boolean)}function curve(cls){const paths={up:'M3 28 C12 28 17 8 33 7',down:'M3 7 C17 8 22 28 33 28',rise:'M3 27 C13 25 18 11 33 6',fall:'M3 6 C17 11 22 25 33 27'};return cls?`<svg class="curve ${cls}" viewBox="0 0 36 34" aria-hidden="true"><path d="${paths[cls]}"></path></svg>`:'<span class="curve"></span>'}function renderPron(d){const ts=tones(d),ms=morae(d[2]);let n=0,classes=[];ms.forEach(m=>{if(m!==' ')classes.push(tone(ts[Math.min(n++,ts.length-1)]||''));else classes.push('space')});$('prosody').innerHTML=classes.map(c=>c==='space'?'<span class="space"></span>':curve(c)).join('');$('pron').innerHTML=ms.map((m,i)=>m===' '?'<span class="space"></span>':`<span class="mora ${classes[i]||''}">${m}</span>`).join('')}function render(){const d=data();if(!d)return;$('where').textContent=(wordMode?'🔤 ':'')+names[cat]+' '+(idx+1)+' / '+L().length;$('ko').textContent=d[1];renderPron(d);$('ja').textContent=d[4];$('a').textContent='A　'+(d[5]||d[1]);$('b').textContent='B　'+(d[6]||'네.');$('guide').textContent=Array.from((d[1]||'').replace(/[\s.!?。！？]/g,''))[0]||'';$('wordNav').classList.toggle('hide',!wordMode);$('normalNav').classList.toggle('hide',wordMode);renderStep()}function renderStep(){for(let i=0;i<4;i++){$('s'+i).classList.toggle('on',i===step);$('d'+i).className='dot '+(i<step?'done':i===step?'now':'')}/* 会話では下側の工程用「次へ」を隠し、重複を防ぐ */if(!wordMode)$('normalNav').classList.toggle('hide',step===3);$('writeArea').classList.add('hide');clearPad()}function start(c){cat=c;idx=0;step=0;wordMode=false;show('lesson');render()}document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));$('homeBtn').onclick=()=>wordMode?(show('wordPage'),renderWords(cat)):show('home');$('prev').onclick=()=>{idx=idx>0?idx-1:L().length-1;step=0;render()};$('skip').onclick=()=>{if(step<3){step++;renderStep()}};function moveWord(delta){idx=(idx+delta+L().length)%L().length;step=0;render();window.scrollTo({top:0,behavior:'smooth'})}$('wordPrev').onclick=()=>moveWord(-1);$('wordNext').onclick=()=>moveWord(1);function voices(){return speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang))}function say(text,rate=1,vn=0,after){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=rate;const vs=voices();if(vs.length)u.voice=vs[vn%vs.length];if(after)u.onend=after;speechSynthesis.speak(u)}$('listen').onclick=()=>say(data()[1],1,0,()=>{step=1;renderStep()});$('slow').onclick=()=>say(data()[1],.68,0);$('speak').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('speechStatus').textContent='🎤 聞きました';setTimeout(()=>{step=2;renderStep()},700);return}const r=new SR();r.lang='ko-KR';$('speechStatus').textContent='🎤 …';r.onresult=e=>{$('speechStatus').textContent='✓ '+e.results[0][0].transcript;setTimeout(()=>{step=2;renderStep()},800)};r.onerror=()=>{$('speechStatus').textContent='もう一度 🎤'};r.start()};$('showWrite').onclick=()=>$('writeArea').classList.remove('hide');$('writeOk').onclick=()=>{step=3;renderStep()};$('conv').onclick=()=>{const d=data();say(d[5]||d[1],1,0,()=>setTimeout(()=>say(d[6]||'네.',1,1),250))};$('finish').onclick=()=>{if(wordMode){moveWord(1);return}idx=(idx+1)%L().length;step=0;render()};function renderWords(c){cat=c;document.querySelectorAll('[data-wcat]').forEach(b=>b.classList.toggle('on',b.dataset.wcat===c));$('wordList').innerHTML=L().map((d,i)=>`<button class="wordItem" data-wi="${i}"><strong>${d[1]}</strong><span>${d[2]}　／　${d[4]}</span></button>`).join('');document.querySelectorAll('[data-wi]').forEach(b=>b.onclick=()=>{idx=+b.dataset.wi;step=0;wordMode=true;show('lesson');render()})}$('wordStart').onclick=()=>{show('wordPage');renderWords('daily')};$('wordBack').onclick=()=>show('home');document.querySelectorAll('[data-wcat]').forEach(b=>b.onclick=()=>renderWords(b.dataset.wcat));const c=$('draw'),ctx=c.getContext('2d');let drawing=false;ctx.lineWidth=10;ctx.lineCap='round';ctx.lineJoin='round';function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.onpointerdown=e=>{drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()};c.onpointermove=e=>{if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()};window.addEventListener('pointerup',()=>drawing=false);function clearPad(){ctx.clearRect(0,0,c.width,c.height)}$('clear').onclick=clearPad;$('aiStart').onclick=()=>show('aiPage');$('aiBack').onclick=()=>show('home');$('aiTalk').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('aiStatus').textContent='この端末では音声入力を使えません';return}const r=new SR();r.lang='ko-KR';$('aiStatus').textContent='🎤 …';r.onresult=e=>{$('aiStatus').textContent='あなた：'+e.results[0][0].transcript;setTimeout(()=>say('좋아요. 계속 이야기해 주세요.',1,1),300)};r.start()};show('home')})();</script></body></html>
