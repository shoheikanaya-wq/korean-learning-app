<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#222222"><link rel="manifest" href="./manifest.webmanifest"><title>韓国語 実践トレーニング</title><style>:root{font-family:system-ui,-apple-system,sans-serif;background:#fffaf2;color:#171717}*{box-sizing:border-box}body{margin:auto;max-width:760px;padding:12px}header{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:24px;margin:8px 0 10px}.tabs,.actions,.nav,.listenrow{display:grid;gap:9px}.tabs{grid-template-columns:repeat(3,1fr)}button,select{min-height:58px;border:2px solid #222;border-radius:14px;background:#fff;font-size:17px;font-weight:800}.tabs .on{background:#222;color:#fff}.scene{width:100%;padding:8px;margin-top:9px}.card{margin-top:12px;padding:16px;border:2px solid #222;border-radius:18px;background:#fff;box-shadow:0 4px #222}.ko{text-align:center;font-size:44px;font-weight:900;line-height:1.25;margin-top:4px}.pronwrap{margin:13px 0 5px;text-align:center}.pron{display:flex;justify-content:center;align-items:center;gap:4px;flex-wrap:wrap;font-weight:900;line-height:1.15}.pron .p{font-size:28px}.pron .weak{font-size:20px;transform:translateY(5px)}.pron .high{transform:translateY(-4px)}.pron .low{transform:translateY(4px)}.tone{text-align:center;font-size:24px;font-weight:900;letter-spacing:4px;min-height:31px}.ja{text-align:center;font-size:21px;margin:8px 0 14px;font-weight:800}.listenrow{grid-template-columns:1.35fr .65fr}.actions{grid-template-columns:1fr 1fr;margin-top:9px}.listen{background:#2469e8!important;color:#fff}.slow{background:#eef4ff}.speak{background:#e45164!important;color:#fff}.feedback{display:none;margin:12px 0 0;padding:13px;background:#f3f3f3;border-radius:12px;font-size:17px;font-weight:700;line-height:1.5}.feedback.show{display:block}.score{font-size:24px;font-weight:900}.mini{border-top:2px dashed #bbb;padding-top:13px;margin-top:15px}.minihead{display:flex;justify-content:space-between;align-items:center;gap:8px}.bubble{margin:7px 0;padding:11px;border-radius:13px;background:#eef4ff;font-size:18px;font-weight:750}.bubble.b{background:#fff0e6}.conv{width:100%;min-height:54px}.progress{text-align:center;font-weight:800;margin:12px 0 6px}.done{font-size:14px;text-align:center;font-weight:800;margin-bottom:8px}.nav{grid-template-columns:1fr 1.4fr}.nav .primary{background:#222;color:#fff}.mode{font-size:13px;min-height:42px;border-radius:999px;padding:6px 10px}.tag{font-size:13px;font-weight:900;border-radius:999px;padding:5px 9px;background:#fff7cf}.turn{font-size:13px;font-weight:900;margin-bottom:3px}@media(max-width:520px){body{padding:10px}.ko{font-size:37px}.pron .p{font-size:25px}.pron .weak{font-size:18px}.tabs button{font-size:15px}.card{padding:14px}}</style></head><body><header><h1>韓国語 実践トレーニング</h1><button id="mode" class="mode">文字 大きめ</button></header><div class="tabs"><button class="on" data-c="daily">日常</button><button data-c="travel">トラベル</button><button data-c="business">ビジネス</button></div><select id="scene" class="scene"></select><main class="card"><div id="ko" class="ko"></div><div class="pronwrap"><div id="pron" class="pron"></div><div id="tone" class="tone"></div></div><div id="ja" class="ja"></div><div class="listenrow"><button id="listen" class="listen">🔊 お手本を聞く</button><button id="slow" class="slow">ゆっくり</button></div><div class="actions"><button id="speak" class="speak">🎤 発音チェック</button><button id="retry">↻ もう一度</button></div><div id="feedback" class="feedback" aria-live="polite"></div><div class="mini"><div class="minihead"><b>ミニ会話</b><span class="tag">2人会話</span></div><div class="bubble"><div class="turn">A</div><span id="a"></span></div><div class="bubble b"><div class="turn">B</div><span id="b"></span></div><button id="conv" class="conv">▶ 会話を聞く</button></div><div id="progress" class="progress"></div><div id="done" class="done"></div><div class="nav"><button id="prev">← 前へ</button><button id="next" class="primary">できた・次へ →</button></div></main><script>const D={daily:[['あいさつ','안녕하세요.','アンニョンハセヨ','↗ → ↘','こんにちは。','안녕하세요.','안녕하세요. 오늘 어때요?'],['買い物','이거 얼마예요?','イゴ オルマエヨ','→ → ↗','これはいくらですか？','이거 얼마예요?','오천 원이에요.'],['飲食','이거 주세요.','イゴ ジュセヨ','→ ↘','これをください。','이거 주세요.','네, 알겠습니다.'],['家族','가족은 잘 지내요?','カジョグン チャル チネヨ','→ → ↗','ご家族は元気ですか？','가족은 잘 지내요?','네, 다 잘 지내요.'],['電話','지금 통화 괜찮아요?','チグム トンファ クェンチャナヨ','→ → ↗','今、電話して大丈夫ですか？','지금 통화 괜찮아요?','네, 괜찮아요.'],['お願い','도와주세요.','トワジュセヨ','↗ ↘','助けてください。','도와주세요.','네, 제가 도와드릴게요.']],travel:[['空港','입국 심사는 어디예요?','イプック シムサヌン オディエヨ','→ → ↗','入国審査はどこですか？','입국 심사는 어디예요?','저쪽으로 가세요.'],['交通','서울역까지 가 주세요.','ソウルリョッカジ カ ジュセヨ','→ → ↘','ソウル駅まで行ってください。','서울역까지 가 주세요.','네, 알겠습니다.'],['ホテル','예약했어요.','イェヤケッソヨ','→ ↘','予約しています。','예약했어요.','성함이 어떻게 되세요?'],['飲食店','추천 메뉴가 뭐예요?','チュチョン メニュガ ムォエヨ','→ → ↗','おすすめメニューは何ですか？','추천 메뉴가 뭐예요?','이 메뉴가 제일 인기 있어요.'],['道案内','여기에서 가까워요?','ヨギエソ カッカウォヨ','→ ↗','ここから近いですか？','여기에서 가까워요?','네, 걸어서 십 분이에요.'],['トラブル','도와주실 수 있어요?','トワジュシル ス イッソヨ','→ → ↗','助けていただけますか？','도와주실 수 있어요?','네, 무슨 일이에요?']],business:[['あいさつ','잘 부탁드립니다.','チャル プタットゥリムニダ','→ ↘','よろしくお願いいたします。','잘 부탁드립니다.','저도 잘 부탁드립니다.'],['確認','확인해 보겠습니다.','ファギネ ボゲッスムニダ','→ → ↘','確認してみます。','확인해 보겠습니다.','네, 부탁드립니다.'],['依頼','자료를 보내 주세요.','チャリョルル ポネ ジュセヨ','→ → ↘','資料を送ってください。','자료를 보내 주세요.','네, 바로 보내겠습니다.'],['会議','회의를 시작하겠습니다.','フェイルル シジャカゲッスムニダ','→ → ↘','会議を始めます。','회의를 시작하겠습니다.','네, 시작하시죠.'],['報告','진행 상황을 보고드리겠습니다.','チネン サンファンウル ポゴドゥリゲッスムニダ','→ → → ↘','進捗状況をご報告します。','진행 상황을 보고드리겠습니다.','네, 말씀해 주세요.'],['納期','납기를 확인하겠습니다.','ナプキルル ファギナゲッスムニダ','→ → ↘','納期を確認します。','납기를 확인하겠습니다.','확인 후 알려 주세요.']]};const $=x=>document.getElementById(x);let state=JSON.parse(localStorage.getItem('korState')||'{}'),c=D[state.c]?state.c:'daily',i=Number.isInteger(state.i)?state.i:0,doneSet=new Set(JSON.parse(localStorage.getItem('korDone')||'[]')),voices=[];function norm(x){return x.replace(/[\s.?!？！。、]/g,'')}function lev(a,b){let m=Array.from({length:b.length+1},(_,r)=>[r]);for(let j=0;j<=a.length;j++)m[0][j]=j;for(let r=1;r<=b.length;r++)for(let j=1;j<=a.length;j++)m[r][j]=b[r-1]===a[j-1]?m[r-1][j-1]:1+Math.min(m[r-1][j-1],m[r][j-1],m[r-1][j]);return m[b.length][a.length]}function similarity(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;return Math.max(0,Math.round((1-lev(a,b)/Math.max(a.length,b.length))*100))}function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang));}loadVoices();speechSynthesis.onvoiceschanged=loadVoices;function voiceFor(n){return voices[n%Math.max(1,voices.length)]||null}function say(t,r=.9,v=0){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=r;let vv=voiceFor(v);if(vv)u.voice=vv;speechSynthesis.speak(u)}function conv(){speechSynthesis.cancel();let x=D[c][i],u1=new SpeechSynthesisUtterance(x[5]),u2=new SpeechSynthesisUtterance(x[6]);u1.lang=u2.lang='ko-KR';u1.rate=.84;u2.rate=.84;let v1=voiceFor(0),v2=voiceFor(1);if(v1)u1.voice=v1;if(v2)u2.voice=v2;u1.onend=()=>speechSynthesis.speak(u2);speechSynthesis.speak(u1)}function renderPron(text,tone){let parts=text.split(' '),arrows=tone.split(/\s+/);$('pron').replaceChildren();parts.forEach((p,n)=>{let s=document.createElement('span');s.textContent=p;s.className='p '+(arrows[n]==='↗'?'high':arrows[n]==='↘'?'low':'');if(p.length<=2&&n>0)s.classList.add('weak');$('pron').appendChild(s)});$('tone').textContent=tone}function showFeedback(nodes){let f=$('feedback');f.replaceChildren(...nodes);f.classList.add('show')}function textNode(tag,text,cls){let e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}function scenes(){i=Math.min(i,D[c].length-1);$('scene').replaceChildren(...D[c].map((x,n)=>{let o=document.createElement('option');o.value=n;o.textContent=x[0];return o}));$('scene').value=i;render()}function render(){let x=D[c][i];$('ko').textContent=x[1];renderPron(x[2],x[3]);$('ja').textContent=x[4];$('a').textContent=x[5];$('b').textContent=x[6];$('progress').textContent=`${i+1} / ${D[c].length}`;$('done').textContent=`できた：${[...doneSet].filter(k=>k.startsWith(c+':')).length} / ${D[c].length}`;$('feedback').classList.remove('show');$('feedback').replaceChildren();document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.c===c));localStorage.setItem('korState',JSON.stringify({c,i}))}$('listen').onclick=()=>say(D[c][i][1],.9,0);$('slow').onclick=()=>say(D[c][i][1],.68,0);$('retry').onclick=()=>say(D[c][i][1],.78,0);$('conv').onclick=conv;$('speak').onclick=()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){showFeedback([textNode('div','この端末では音声認識が使えません。お手本を聞いて、同じ区切りで繰り返してください。')]);return}let r=new R();r.lang='ko-KR';r.interimResults=false;r.maxAlternatives=1;showFeedback([textNode('div','聞いています…')]);r.onresult=e=>{let heard=e.results[0][0].transcript,target=D[c][i][1],sc=similarity(heard,target),msg=sc>=90?'かなり近いです。':sc>=75?'伝わる形に近づいています。':sc>=55?'語尾と区切りをもう一度確認しましょう。':'短いかたまりごとに、ゆっくりまねしてみましょう。';showFeedback([textNode('div',sc+'%','score'),textNode('div','聞き取り：'+heard),textNode('div',msg)])};r.onerror=()=>showFeedback([textNode('div','聞き取れませんでした。ゆっくりボタンで確認して、もう一度どうぞ。')]);r.start()};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{c=b.dataset.c;i=0;scenes()});$('scene').onchange=e=>{i=+e.target.value;render()};$('prev').onclick=()=>{i=(i-1+D[c].length)%D[c].length;$('scene').value=i;render()};$('next').onclick=()=>{doneSet.add(c+':'+i);localStorage.setItem('korDone',JSON.stringify([...doneSet]));i=(i+1)%D[c].length;$('scene').value=i;render()};$('mode').onclick=()=>{let on=document.body.classList.toggle('big');document.documentElement.style.fontSize=on?'120%':'100%';$('mode').textContent=on?'文字 標準':'文字 大きめ';localStorage.setItem('korBig',on?'1':'0')};if(localStorage.getItem('korBig')==='1'){document.documentElement.style.fontSize='120%';document.body.classList.add('big');$('mode').textContent='文字 標準'}if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));scenes();</script></body></html>
