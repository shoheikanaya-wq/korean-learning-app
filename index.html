(()=>{'use strict';const $=id=>document.getElementById(id),names={daily:'🏠 日常',travel:'✈️ 旅行',business:'💼 仕事'};let cat='daily',idx=0,step=0,wordReturn=false;const L=()=>window.LESSONS?.[cat]||[],data=()=>L()[idx]||L()[0];function show(id){['home','lesson','aiPage','wordPage'].forEach(x=>$(x).classList.toggle('hide',x!==id))}function morae(s){const out=[];for(const ch of Array.from(s||'')){if(/[ァィゥェォャュョヮー]/.test(ch)&&out.length&&out[out.length-1]!==' ')out[out.length-1]+=ch;else out.push(ch)}return out}function pronHTML(k,t){const tones=(t||'').trim().split(/\s+/).filter(Boolean);let n=0;return morae(k).map(m=>{if(m===' ')return'<span class="space"></span>';const z=tones[Math.min(n++,tones.length-1)]||'';let cls='',a='';if(z.includes('↴')){cls='up';a='↑'}else if(z.includes('↵')){cls='down';a='↓'}else if(z.includes('↗')){cls='rise';a='↗'}else if(z.includes('↘')){cls='fall';a='↘'}return `<span class="mora ${cls}">${m}${a?`<span class="arrow">${a}</span>`:''}</span>`}).join('')}function render(){const d=data();if(!d)return;$('where').textContent=(wordReturn?'🔤 単語':'')+names[cat]+' '+(idx+1)+' / '+L().length;$('ko').textContent=d[1];$('pron').innerHTML=pronHTML(d[2],d[3]);$('ja').textContent=d[4];$('a').textContent='A　'+(d[5]||d[1]);$('b').textContent='B　'+(d[6]||'네.');$('guide').textContent=Array.from((d[1]||'').replace(/[\s.!?。！？]/g,''))[0]||'';renderStep()}function renderStep(){for(let i=0;i<4;i++){$('s'+i).classList.toggle('on',i===step);$('d'+i).className='dot '+(i<step?'done':i===step?'now':'')}$('writeArea').classList.add('hide');clearPad()}function start(c){cat=c;idx=0;step=0;wordReturn=false;show('lesson');render()}document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));$('homeBtn').onclick=()=>{if(wordReturn){show('wordPage');renderWords(cat)}else show('home')};$('prev').onclick=()=>{idx=idx>0?idx-1:L().length-1;step=0;render()};$('skip').onclick=()=>{step=Math.min(3,step+1);renderStep()};function voices(){return speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang))}function say(text,rate=1,voiceNo=0,after){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ko-KR';u.rate=rate;const vs=voices();if(vs.length)u.voice=vs[voiceNo%vs.length];if(after)u.onend=after;speechSynthesis.speak(u)}$('listen').onclick=()=>say(data()[1],1,0,()=>{step=1;renderStep()});$('slow').onclick=()=>say(data()[1],.68,0);$('speak').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('speechStatus').textContent='🎤 聞きました';setTimeout(()=>{step=2;renderStep()},700);return}const r=new SR();r.lang='ko-KR';$('speechStatus').textContent='🎤 …';r.onresult=e=>{$('speechStatus').textContent='✓ '+e.results[0][0].transcript;setTimeout(()=>{step=2;renderStep()},900)};r.onerror=()=>{$('speechStatus').textContent='もう一度 🎤'};r.start()};$('showWrite').onclick=()=>$('writeArea').classList.remove('hide');$('writeOk').onclick=()=>{step=3;renderStep()};$('conv').onclick=()=>{const d=data();say(d[5]||d[1],1,0,()=>setTimeout(()=>say(d[6]||'네.',1,1),250))};$('finish').onclick=()=>{if(wordReturn){show('wordPage');renderWords(cat);return}idx=(idx+1)%L().length;step=0;render();window.scrollTo({top:0,behavior:'smooth'})};
function renderWords(c){cat=c;document.querySelectorAll('[data-wcat]').forEach(b=>b.classList.toggle('on',b.dataset.wcat===c));$('wordList').innerHTML=L().map((d,i)=>`<button class="wordItem" data-wi="${i}"><strong>${d[1]}</strong><span>${d[2]}　／　${d[4]}</span></button>`).join('');document.querySelectorAll('[data-wi]').forEach(b=>b.onclick=()=>{idx=Number(b.dataset.wi);step=0;wordReturn=true;show('lesson');render()})}$('wordStart').onclick=()=>{show('wordPage');renderWords('daily')};$('wordBack').onclick=()=>show('home');document.querySelectorAll('[data-wcat]').forEach(b=>b.onclick=()=>renderWords(b.dataset.wcat));
const c=$('draw'),ctx=c.getContext('2d');let drawing=false;ctx.lineWidth=10;ctx.lineCap='round';ctx.lineJoin='round';function pos(e){const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}}function down(e){drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()}function move(e){if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()}c.addEventListener('pointerdown',down);c.addEventListener('pointermove',move);window.addEventListener('pointerup',()=>drawing=false);function clearPad(){ctx.clearRect(0,0,c.width,c.height)}$('clear').onclick=clearPad;$('aiStart').onclick=()=>show('aiPage');$('aiBack').onclick=()=>show('home');$('aiTalk').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('aiStatus').textContent='この端末では音声入力を使えません';return}const r=new SR();r.lang='ko-KR';$('aiStatus').textContent='🎤 …';r.onresult=e=>{$('aiStatus').textContent='あなた：'+e.results[0][0].transcript;setTimeout(()=>say('좋아요. 계속 이야기해 주세요.',1,1),300)};r.onerror=()=>{$('aiStatus').textContent='もう一度 🎤'};r.start()};show('home')})();
