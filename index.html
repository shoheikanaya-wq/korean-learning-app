<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>韓国語 実践トレーニング</title><style>:root{font-family:system-ui,-apple-system,sans-serif;background:#fffaf2;color:#171717}*{box-sizing:border-box}body{margin:auto;max-width:760px;padding:14px}h1{font-size:24px}.tabs,.actions,.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.tabs button,.actions button,.nav button,select,.writebtn{min-height:58px;border:2px solid #222;border-radius:14px;background:#fff;font-size:17px;font-weight:800}.tabs .on{background:#222;color:#fff}.card{margin-top:12px;padding:18px;border:2px solid #222;border-radius:18px;background:#fff;box-shadow:0 4px #222}.ko{text-align:center;font-size:42px;font-weight:900;line-height:1.25}.pron{text-align:center;font-size:26px;font-weight:900}.tone,.ja{text-align:center;font-size:20px;margin:8px}.ja{font-weight:800}.actions{grid-template-columns:1fr 1fr}.listen{background:#2469e8!important;color:#fff}.speak{background:#e45164!important;color:#fff}.feedback{margin:12px 0;padding:13px;background:#f3f3f3;border-radius:12px;font-size:17px;font-weight:700;line-height:1.5}.mini,.writing{border-top:2px dashed #bbb;padding-top:12px;margin-top:14px}.bubble{margin:7px 0;padding:11px;border-radius:13px;background:#eef4ff;font-size:17px;font-weight:700}.bubble.b{background:#fff0e6}.nav{grid-template-columns:1fr 1.4fr;margin-top:14px}.nav .primary{background:#222;color:#fff}.progress{text-align:center;font-weight:800;margin:10px}.scene{width:100%;padding:8px}.writehead{display:flex;justify-content:space-between;align-items:center;gap:8px}.writeguide{font-size:15px;font-weight:700;margin:7px 0}.writebox{width:100%;min-height:105px;border:3px solid #555;border-radius:14px;padding:12px;font-size:30px;font-weight:800;resize:vertical;background:#fff}.writeactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.writebtn{min-height:52px}.answer{margin-top:8px;padding:10px;border-radius:10px;background:#fff7cf;font-size:20px;font-weight:900;display:none}.mode{font-size:13px;border:2px solid #222;border-radius:999px;background:#fff;padding:7px 10px;font-weight:900}@media(max-width:520px){body{padding:10px}.ko{font-size:35px}.pron{font-size:23px}.tabs button{font-size:15px}.card{padding:14px}.writebox{font-size:28px}}</style></head><body><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><h1>韓国語 実践トレーニング</h1><button id="mode" class="mode">文字 大きめ</button></div><div class="tabs"><button class="on" data-c="daily">日常</button><button data-c="travel">トラベル</button><button data-c="business">ビジネス</button></div><select id="scene" class="scene"></select><main class="card"><div id="ko" class="ko"></div><div id="pron" class="pron"></div><div id="tone" class="tone"></div><div id="ja" class="ja"></div><div class="actions"><button id="listen" class="listen">🔊 お手本を聞く</button><button id="speak" class="speak">🎤 私も話す</button></div><div id="feedback" class="feedback">お手本を聞いて、続けて話してみましょう。</div><div class="writing"><div class="writehead"><b>✍ 書いて覚える</b><span id="writeCount"></span></div><div class="writeguide">上の韓国語を見ながら入力してOK。慣れたら見ないで挑戦。</div><textarea id="writebox" class="writebox" lang="ko" placeholder="ここに韓国語を書きます"></textarea><div class="writeactions"><button id="check" class="writebtn">答え合わせ</button><button id="clear" class="writebtn">書き直す</button></div><div id="answer" class="answer"></div></div><div class="mini"><b>ミニ会話</b><div id="a" class="bubble"></div><div id="b" class="bubble b"></div><button id="conv" class="writebtn" style="width:100%">▶ 会話を聞く</button></div><div id="progress" class="progress"></div><div class="nav"><button id="prev">← 前へ</button><button id="next" class="primary">できた・次へ →</button></div></main><script>const D={daily:[['あいさつ','안녕하세요.','アンニョンハセヨ','↗ アンニョン ↘ ハセヨ','こんにちは。','A：안녕하세요.','B：안녕하세요. 오늘 어때요?'],['買い物','이거 얼마예요?','イゴ オルマエヨ?','→ イゴ ↗ オルマエヨ?','これはいくらですか？','A：이거 얼마예요?','B：오천 원이에요.'],['飲食','이거 주세요.','イゴ ジュセヨ','→ イゴ ↘ ジュセヨ','これをください。','A：이거 주세요.','B：네, 알겠습니다.']],travel:[['空港','입국 심사는 어디예요?','イプック シムサヌン オディエヨ?','→ → ↗','入国審査はどこですか？','A：입국 심사는 어디예요?','B：저쪽으로 가세요.'],['交通','서울역까지 가 주세요.','ソウルリョッカジ カ ジュセヨ','→ → ↘','ソウル駅まで行ってください。','A：서울역까지 가 주세요.','B：네, 알겠습니다.'],['ホテル','예약했어요.','イェヤケッソヨ','→ ↘','予約しています。','A：예약했어요.','B：성함이 어떻게 되세요?']],business:[['あいさつ','잘 부탁드립니다.','チャル プタットゥリムニダ','→ ↘','よろしくお願いいたします。','A：잘 부탁드립니다.','B：저도 잘 부탁드립니다.'],['確認','확인해 보겠습니다.','ファギネ ボゲッスムニダ','→ → ↘','確認してみます。','A：확인해 보겠습니다.','B：네, 부탁드립니다.'],['依頼','자료를 보내 주세요.','チャリョルル ポネ ジュセヨ','→ → ↘','資料を送ってください。','A：자료를 보내 주세요.','B：네, 바로 보내겠습니다.']]};let s=JSON.parse(localStorage.getItem('korState')||'{}'),c=D[s.c]?s.c:'daily',i=Number.isInteger(s.i)?s.i:0,$=x=>document.getElementById(x);function norm(x){return x.replace(/[\s.?!？！。、]/g,'')}function scenes(){i=Math.min(i,D[c].length-1);$('scene').innerHTML=D[c].map((x,n)=>`<option value="${n}">${x[0]}</option>`).join('');$('scene').value=i;render()}function render(){let x=D[c][i];['ko','pron','tone','ja','a','b'].forEach((k,n)=>$(k).textContent=x[n+1]);$('progress').textContent=`${i+1} / ${D[c].length}`;$('feedback').textContent='お手本を聞いて、続けて話してみましょう。';$('writebox').value='';$('answer').style.display='none';$('writeCount').textContent='';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.c===c));localStorage.setItem('korState',JSON.stringify({c,i,big:document.body.classList.contains('big')}))}function say(t,r=.88){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=r;speechSynthesis.speak(u)}$('listen').onclick=()=>say(D[c][i][1]);$('conv').onclick=()=>say(D[c][i][5]+' '+D[c][i][6],.82);$('speak').onclick=()=>{let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('feedback').textContent='この端末では音声認識が使えません。お手本と同じリズムで繰り返してください。';return}let r=new R();r.lang='ko-KR';$('feedback').textContent='聞いています…';r.onresult=e=>{let h=e.results[0][0].transcript;$('feedback').innerHTML='聞き取り：<b>'+h+'</b><br>お手本と比べて、語尾とリズムを確認しましょう。'};r.onerror=()=>$('feedback').textContent='聞き取れませんでした。もう一度ゆっくり話してみましょう。';r.start()};$('writebox').oninput=e=>$('writeCount').textContent=e.target.value.length+'文字';$('check').onclick=()=>{let mine=norm($('writebox').value),ans=norm(D[c][i][1]);$('answer').style.display='block';$('answer').innerHTML=mine===ans?'◎ 正解！<br>'+D[c][i][1]:'もう一度見比べてみましょう。<br>答え：'+D[c][i][1]};$('clear').onclick=()=>{$('writebox').value='';$('writeCount').textContent='';$('answer').style.display='none';$('writebox').focus()};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{c=b.dataset.c;i=0;scenes()});$('scene').onchange=e=>{i=+e.target.value;render()};$('prev').onclick=()=>{i=(i-1+D[c].length)%D[c].length;$('scene').value=i;render()};$('next').onclick=()=>{i=(i+1)%D[c].length;$('scene').value=i;render()};$('mode').onclick=()=>{let on=document.body.classList.toggle('big');document.documentElement.style.fontSize=on?'120%':'100%';$('mode').textContent=on?'文字 標準':'文字 大きめ';localStorage.setItem('korBig',on?'1':'0')};if(localStorage.getItem('korBig')==='1'){document.documentElement.style.fontSize='120%';document.body.classList.add('big');$('mode').textContent='文字 標準'}scenes();</script></body></html>
