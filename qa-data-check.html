<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>韓国語アプリ 教材QA</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:16px;line-height:1.6;background:#f7f4ee;color:#2f2924}h1{font-size:24px}.ok{color:#176b35}.ng{color:#a12622}.card{background:#fff;border:1px solid #ccc;border-radius:12px;padding:12px;margin:10px 0}code{word-break:break-all}</style></head><body><h1>教材データ QA</h1><div id="out">確認中…</div><script src="./lessons.js"></script><script src="./lessons-extra.js"></script><script>(()=>{const out=document.getElementById('out'),cats=['daily','travel','business'],allowedTone=/^[↴↵↗↘→〜\s]*$/,issues=[],counts={};let total=0;const seenKo=new Map();for(const c of cats){const L=window.LESSONS?.[c]||[];counts[c]=L.length;total+=L.length;L.forEach((x,i)=>{const where=`${c}[${i}] ${x?.[0]||''}`;if(!Array.isArray(x)||x.length!==7){issues.push(`${where}: 項目数が7ではありません`);return}if(x.some(v=>typeof v!=='string'||!v.trim()))issues.push(`${where}: 空欄があります`);if(!/[가-힣]/.test(x[1]))issues.push(`${where}: 韓国語本文が見つかりません`);if(!/[ァ-ヶー]/.test(x[2]))issues.push(`${where}: カタカナ発音が見つかりません`);if(!allowedTone.test(x[3]))issues.push(`${where}: 抑揚記号に想定外文字があります → ${x[3]}`);if(/[�]/.test(x.join('')))issues.push(`${where}: 文字化け記号「�」があります`);if(seenKo.has(x[1]))issues.push(`${where}: 韓国語本文が重複（${seenKo.get(x[1])}）`);else seenKo.set(x[1],where);if(!/[가-힣]/.test(x[5])||!/[가-힣]/.test(x[6]))issues.push(`${where}: ミニ会話A/Bの韓国語を確認してください`);});}const rows=`日常 ${counts.daily}問 / トラベル ${counts.travel}問 / ビジネス ${counts.business}問 / 合計 ${total}問`;out.innerHTML=`<div class="card"><strong>教材数</strong><br>${rows}</div>`+(issues.length?`<div class="card ng"><strong>要確認 ${issues.length}件</strong><ol>${issues.map(x=>`<li><code>${x}</code></li>`).join('')}</ol></div>`:`<div class="card ok"><strong>基本データチェック：OK</strong><br>7項目構造、空欄、文字化け、抑揚記号、本文重複、会話A/Bを確認しました。</div>`);})();</script></body></html>
