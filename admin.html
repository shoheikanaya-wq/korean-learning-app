<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>韓国語 学習状況</title><style>
:root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#211d19;background:#f5f1e8}
*{box-sizing:border-box}body{max-width:820px;margin:auto;padding:14px;background:#f5f1e8}main{background:#fff;border:2px solid #8d8175;border-radius:20px;padding:18px}h1{font-size:27px;margin:0 0 12px}h2{font-size:22px;margin:22px 0 8px}.note{padding:12px;background:#eee6d9;border-radius:12px;font-weight:750}.login{display:grid;gap:10px}.login label{font-weight:850}.login input{display:block;width:100%;margin-top:5px;font:inherit;min-height:50px;border-radius:12px;border:2px solid #65584d;padding:8px 12px}.login button{font:inherit;min-height:54px;border-radius:12px;border:2px solid #65584d;padding:8px 12px;font-weight:900;background:#65584d;color:#fff}.status{font-weight:850;min-height:24px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.summary div{padding:11px 6px;text-align:center;border:2px solid #d8d0c5;border-radius:13px;background:#faf7f1}.summary b{display:block;font-size:27px}.device,.feedback{margin-top:12px;padding:14px;border:2px solid #b9aa98;border-radius:14px;background:#fffdf8}.device.today{border-color:#4e8a5b;background:#f0faef}.device.stale{border-color:#b9aa98}.headline{display:flex;justify-content:space-between;gap:8px;align-items:center}.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:14px;font-weight:950;background:#eee}.badge.today{background:#dff3df;color:#235b2d}.badge.old{background:#f2ece3}.times{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0;font-size:16px}.progress{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.progress div{padding:8px;text-align:center;background:#f3efe8;border-radius:10px;font-weight:850}.progress b{display:block;font-size:20px}.feedback small{display:block;margin-top:8px;color:#625a52}.empty{padding:14px;background:#f6f2eb;border-radius:12px}.muted{color:#665f58;font-size:14px}@media(max-width:560px){body{padding:6px}main{padding:12px}.summary,.progress,.times{grid-template-columns:1fr}.headline{align-items:flex-start}.summary div{display:flex;justify-content:space-between;align-items:center}.summary b{font-size:23px}}
</style></head><body><main><h1>韓国語 学習状況</h1><p class="note">管理者専用。名前・電話番号・メール・位置情報は扱いません。</p><div class="login"><label>進捗API<input id="api" placeholder="Cloud Run API URL" inputmode="url"></label><label>管理者トークン<input id="token" type="password" autocomplete="off"></label><button id="health">API接続チェック</button><button id="load">最新状況を確認</button></div><p id="status" class="status"></p><div id="summary" class="summary"></div><h2>学習状況</h2><div id="devices"></div><h2>改善要望</h2><div id="feedback"></div><p class="muted">管理者トークンはこの画面に保存しません。</p></main><script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>t?new Date(t).toLocaleString('ja-JP'):'記録なし';
const sameLocalDay=t=>{if(!t)return false;const a=new Date(t),b=new Date();return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()};
const ago=t=>{if(!t)return'記録なし';const d=Math.max(0,Date.now()-Number(t)),m=Math.floor(d/60000);if(m<1)return'たった今';if(m<60)return m+'分前';const h=Math.floor(m/60);if(h<24)return h+'時間前';return Math.floor(h/24)+'日前'};
const pct=x=>{const d=Number(x?.done||0),t=Number(x?.total||0);return t?Math.round(d/t*100):0};
$('health').onclick=async()=>{const base=$('api').value.trim().replace(/\/$/,'');if(!base){$('status').textContent='API URLを入力してください';return}$('status').textContent='接続確認中…';try{const r=await fetch(base+'/health',{cache:'no-store'});const d=await r.json();$('status').textContent=r.ok&&d.ok?'API接続OK':'API応答あり・異常'}catch(e){$('status').textContent='APIに接続できません'}};
const renderDevice=x=>{const today=sameLocalDay(x.opened);const p=x.progress||{};return '<div class="device '+(today?'today':'stale')+'"><div class="headline"><strong>匿名端末</strong><span class="badge '+(today?'today':'old')+'">'+(today?'今日使った':'最終 '+esc(ago(x.opened)))+'</span></div><div class="times"><div>最終起動<br><b>'+esc(fmt(x.opened))+'</b></div><div>最終学習<br><b>'+esc(fmt(x.lastStudy))+'</b></div></div><div>起動回数 <b>'+Number(x.launches||0)+'</b>回　／　学習済み <b>'+Number(x.studied||0)+'</b>教材</div><div class="progress"><div>日常<b>'+Number(p.daily?.done||0)+' / '+Number(p.daily?.total||0)+'</b>'+pct(p.daily)+'%</div><div>旅行<b>'+Number(p.travel?.done||0)+' / '+Number(p.travel?.total||0)+'</b>'+pct(p.travel)+'%</div><div>仕事<b>'+Number(p.business?.done||0)+' / '+Number(p.business?.total||0)+'</b>'+pct(p.business)+'%</div></div></div>'};
$('api').value=localStorage.getItem('korAdminApi')||'';
$('load').onclick=async()=>{const base=$('api').value.trim().replace(/\/$/,'');const token=$('token').value;$('status').textContent='確認中…';$('devices').innerHTML='';$('feedback').innerHTML='';$('summary').innerHTML='';if(!base||!token){$('status').textContent='APIと管理者トークンを入力してください';return}localStorage.setItem('korAdminApi',base);try{const headers={Authorization:'Bearer '+token};const [dr,fr]=await Promise.all([fetch(base+'/v1/admin/devices',{headers}),fetch(base+'/v1/admin/feedback',{headers})]);const d=await dr.json(),fd=await fr.json();if(!dr.ok)throw new Error(d.error||dr.status);if(!fr.ok)throw new Error(fd.error||fr.status);const devices=Array.isArray(d.devices)?d.devices:[],feedback=Array.isArray(fd.feedback)?fd.feedback:[];const todayCount=devices.filter(x=>sameLocalDay(x.opened)).length;const latest=devices.reduce((m,x)=>Math.max(m,Number(x.opened||0)),0);$('summary').innerHTML='<div><span>今日利用</span><b>'+todayCount+'</b></div><div><span>登録端末</span><b>'+devices.length+'</b></div><div><span>最終受信</span><b style="font-size:18px">'+esc(ago(latest))+'</b></div>';$('devices').innerHTML=devices.map(renderDevice).join('')||'<div class="empty">まだ学習記録はありません。</div>';$('feedback').innerHTML=feedback.map(x=>'<div class="feedback"><strong>'+esc(x.type||'その他')+'</strong><div>'+esc(x.text||'')+'</div><small>'+esc(fmt(x.createdAt))+'</small></div>').join('')||'<div class="empty">改善要望はまだありません。</div>';$('status').textContent='最新データを取得しました'}catch(e){$('status').textContent='取得できません：'+esc(e.message)}};
</script></body></html>
