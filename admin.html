<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>韓国語 学習状況</title><style>body{font-family:system-ui,sans-serif;max-width:760px;margin:auto;padding:20px;background:#f5f1e8;color:#211d19}main{background:#fff;border:2px solid #8d8175;border-radius:20px;padding:20px}h1{font-size:26px}button,input{font:inherit;min-height:50px;border-radius:12px;border:2px solid #65584d;padding:8px 12px}input{width:100%}button{font-weight:800;margin-top:10px}.note{padding:12px;background:#eee6d9;border-radius:12px}.device{margin-top:12px;padding:14px;border:2px solid #b9aa98;border-radius:14px}</style></head><body><main><h1>韓国語 学習状況</h1><p class="note">管理者専用。名前・電話番号・位置情報は表示しません。</p><label>進捗API<input id="api" placeholder="Cloud Run API URL"></label><label>管理者トークン<input id="token" type="password" autocomplete="off"></label><button id="load">学習状況を確認</button><p id="status"></p><h2>学習状況</h2><div id="devices"></div><h2>改善要望</h2><div id="feedback"></div></main><script>
const $=id=>document.getElementById(id);
$('load').onclick=async()=>{const base=$('api').value.trim().replace(/\/$/,'');const token=$('token').value;$('status').textContent='確認中…';$('devices').innerHTML='';try{const r=await fetch(base+'/v1/admin/devices',{headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);$('status').textContent=d.devices.length?'取得しました':'まだ記録はありません';$('devices').innerHTML=d.devices.map(x=>'<div class="device"><strong>匿名端末</strong><br>最終起動 '+new Date(x.opened).toLocaleString('ja-JP')+'<br>学習済み '+x.studied+'<br>日常 '+x.progress.daily.done+'/'+x.progress.daily.total+'　旅行 '+x.progress.travel.done+'/'+x.progress.travel.total+'　仕事 '+x.progress.business.done+'/'+x.progress.business.total+'</div>').join('');const fr=await fetch(base+'/v1/admin/feedback',{headers:{Authorization:'Bearer '+token}});const fd=await fr.json();if(fr.ok)$('feedback').innerHTML=fd.feedback.map(x=>'<div class="device"><strong>'+x.type+'</strong><br>'+x.text+'<br><small>'+new Date(x.createdAt).toLocaleString('ja-JP')+'</small></div>').join('')||'まだありません'}catch(e){$('status').textContent='取得できません：'+e.message}};
</script></body></html>
