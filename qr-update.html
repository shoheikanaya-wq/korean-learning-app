<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>韓国語アプリ 更新QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
html,body{margin:0;background:#f3efe6;color:#211d19;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
.wrap{max-width:520px;margin:0 auto;padding:20px;text-align:center}
h1{font-size:26px;margin:6px 0 4px}
.sub{font-size:17px;font-weight:700;color:#514a43;margin:0 0 14px}
#qr{display:inline-block;background:#fff;padding:16px;border-radius:16px;border:3px solid #2f6f4f}
ol{text-align:left;font-size:19px;line-height:1.7;font-weight:700;margin:16px auto;max-width:420px;padding-left:26px}
.url{font-size:14px;word-break:break-all;color:#514a43;margin:8px 0}
.btn{display:block;margin:10px auto;min-height:56px;line-height:56px;max-width:420px;border-radius:14px;font-size:20px;font-weight:900;text-decoration:none;border:0;width:100%;cursor:pointer}
.g{background:#2f6f4f;color:#fff}.w{background:#fff;color:#2f6f4f;border:3px solid #2f6f4f}
@media print{.btn{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>韓国語アプリ 更新QR</h1>
  <p class="sub">読み取ると、アプリが最新になります</p>
  <div id="qr"></div>
  <div class="url" id="url"></div>
  <ol>
    <li>スマホのカメラで、このQRを読み取ります</li>
    <li>開いたページが、自動で更新します</li>
    <li>そのままアプリが開きます(学習の記録は消えません)</li>
  </ol>
  <button class="btn g" id="cp" type="button">🔗 リンクをコピー</button>
  <a class="btn w" id="ln" href="#">LINEで送る</a>
</div>
<script>
(function(){
  var u=new URL('update.html',location.href).href;
  document.getElementById('url').textContent=u;
  try{ if(window.QRCode)new QRCode(document.getElementById('qr'),{text:u,width:240,height:240,correctLevel:QRCode.CorrectLevel.M});
       else document.getElementById('qr').textContent='QRを作れませんでした。下のリンクを送ってください。'; }catch(e){}
  document.getElementById('ln').href='https://line.me/R/msg/text/?'+encodeURIComponent('韓国語アプリの更新です。このリンクを開くと、最新になります。\n'+u);
  document.getElementById('cp').onclick=function(){try{navigator.clipboard.writeText(u);this.textContent='コピーしました ✓'}catch(e){}};
})();
</script>
</body>
</html>
